<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quán Trọ Capy</title>
    
    <!-- Favicon: Capy thắt nơ -->
    <link rel="icon" href="ChatGPT_Image_18_19_44_30_thg_7__2026-removebg-preview.png" type="image/png">
    
    <!-- Fonts: Fredoka (Tiêu đề 3D), Comfortaa (Đáng yêu) & Nunito (Chữa lành) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700;800&family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Supabase & LocalForage -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        /* ============================================================
           BẢNG MÀU & VIBE (HEALING INN / COZY STYLE)
           ============================================================ */
        :root {
            --bg-main: #FFF9F5; /* Nền kem sữa ấm */
            --bg-card: #FFFFFF; 
            --text-dark: #3D2314; /* Nâu ca cao đậm đặc */
            --text-muted: #9E8576; /* Nâu nhạt */
            --accent-peach: #FF9F7C; /* Cam đào pastel */
            --accent-pink: #FFB6B9; /* Hồng lụa coquette */
            --accent-mocha: #E8D5C4; /* Nâu gỗ nhạt */
            --border-soft: #F4EBE6;
            
            --font-title: 'Fredoka', sans-serif;
            --font-heading: 'Comfortaa', cursive;
            --font-body: 'Nunito', sans-serif;
            --shadow-soft: 0 12px 35px rgba(92, 64, 51, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-main);
            background-image: radial-gradient(var(--accent-mocha) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: var(--text-dark); 
            font-family: var(--font-body); 
            min-height: 100vh; overflow-x: hidden; line-height: 1.6;
        }
        button { cursor: pointer; border: none; background: none; font-family: inherit; outline: none;}
        input, select, textarea { font-family: inherit; outline: none; }
        img { max-width: 100%; display: block; }
        a { text-decoration: none; color: inherit; }
        .hidden { display: none !important; }

        /* ============================================================
           STYLE ICON PIXEL (8-BIT)
           ============================================================ */
        .svg-icon {
            display: inline-block; vertical-align: middle;
            width: 26px; height: 26px; overflow: visible;
            shape-rendering: crispEdges;
        }

        /* Hiệu ứng nhún nhảy đáng yêu */
        .bounce { animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-8px); } 
        }

        /* ============================================================
           HEADER & BẢNG HIỆU KEM SỮA BO TRÒN
           ============================================================ */
        .header-section {
            max-width: 850px; margin: 40px auto 30px auto; text-align: center; padding: 0 20px;
        }
        
        .signboard-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto 15px auto;
        }

        /* Tấm bảng kem sữa viền nâu mảnh */
        .cream-board {
            background: #FFFBF8;
            border: 4px solid var(--text-dark);
            border-radius: 25px; /* Bo tròn mượt mà */
            padding: 20px 40px;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 0 rgba(92, 64, 51, 0.08);
            cursor: pointer; 
            user-select: none; /* KHÔNG THỂ BÔI ĐEN, BẢO ĐẢM DBLCLICK MƯỢT */
            transition: 0.2s;
        }
        .cream-board:active { transform: scale(0.98); box-shadow: 0 5px 0 rgba(92, 64, 51, 0.08); }

        /* Nơ hồng lụa dán góc */
        .pink-bow {
            position: absolute;
            top: -20px; left: -25px;
            width: 75px;
            z-index: 3;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
            transform: rotate(-15deg);
        }

        /* CHỮ QUÁN TRỌ CAPY STICKER 3D (Fredoka) */
        .station-title {
            font-family: var(--font-title); 
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            font-weight: 700;
            color: var(--text-dark); 
            margin: 0;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            /* Hiệu ứng 3D khối: Lớp 1 (Viền trắng 3px) - Lớp 2 (Bóng đổ cứng 4px màu hồng) */
            text-shadow: 
                -3px -3px 0 #FFF, 3px -3px 0 #FFF, -3px 3px 0 #FFF, 3px 3px 0 #FFF,
                 0px -3px 0 #FFF, 0px 3px 0 #FFF, -3px 0px 0 #FFF, 3px 0px 0 #FFF,
                -2px -3px 0 #FFF, 2px -3px 0 #FFF, -2px 3px 0 #FFF, 2px 3px 0 #FFF,
                -3px -2px 0 #FFF, 3px -2px 0 #FFF, -3px 2px 0 #FFF, 3px 2px 0 #FFF,
                 0px 7px 0px var(--accent-pink),
                -1px 7px 0px var(--accent-pink),
                 1px 7px 0px var(--accent-pink),
                -2px 7px 0px var(--accent-pink),
                 2px 7px 0px var(--accent-pink),
                -3px 7px 0px var(--accent-pink),
                 3px 7px 0px var(--accent-pink);
        }

        /* Lời tựa giới thiệu (Tự do, không viền) */
        .station-desc-freestyle {
            font-size: 1.05rem; 
            color: var(--text-muted); /* Nâu nhạt hơn để phân cấp */
            font-style: italic; 
            text-align: center;
            margin: 0 auto 35px auto;
            max-width: 650px;
            font-weight: 700;
            line-height: 1.6;
        }

        /* Các Nút Trung Tâm (2 Ô hình viên thuốc) */
        .top-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-top {
            padding: 14px 28px; border-radius: 50px; font-weight: 800; font-size: 1rem;
            background: #FFF; border: 3px solid var(--border-soft); color: var(--text-dark); 
            transition: 0.3s; box-shadow: 0 6px 15px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 10px;
        }
        .btn-top:hover { border-color: var(--accent-peach); background: #FFF4F0; transform: translateY(-4px); }

        /* ============================================================
           THANH LỌC TAG ĐỘNG & TÌM KIẾM
           ============================================================ */
        .filter-section {
            max-width: 1200px; margin: 0 auto 50px auto; padding: 0 20px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        /* Thanh Search có Icon lúp pixel */
        .search-wrapper { 
            width: 100%; max-width: 600px; position: relative; display: flex; align-items: center;
        }
        .search-icon-box {
            position: absolute; left: 22px; display: flex; align-items: center; justify-content: center; color: var(--text-dark);
        }
        .search-input {
            width: 100%; padding: 18px 20px 18px 60px; border-radius: 50px; background: #FFF;
            border: 3px solid var(--border-soft); color: var(--text-dark); font-size: 1.05rem; font-weight: 700;
            transition: 0.3s; box-shadow: var(--shadow-soft);
        }
        .search-input:focus { border-color: var(--accent-peach); }
        .search-input::placeholder { color: #C4B5A9; font-weight: 600; }

        /* Tag Viên thuốc */
        .pill-tags-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 900px; }
        .pill-tag {
            padding: 10px 24px; border-radius: 50px; font-size: 0.95rem; font-weight: 800;
            background: #FFF; border: 3px solid var(--border-soft); color: var(--text-muted);
            transition: 0.3s; box-shadow: 0 4px 10px rgba(92, 64, 51, 0.03);
        }
        .pill-tag:hover { background: #FFF3EE; transform: translateY(-3px); border-color: var(--accent-peach); color: var(--text-dark);}
        .pill-tag.active { 
            background: var(--accent-peach); border-color: var(--accent-peach); color: #FFF; 
            box-shadow: 0 8px 20px rgba(255,159,124,0.3); transform: translateY(-2px);
        }

        /* ============================================================
           GRID THẺ NHÂN VIÊN
           ============================================================ */
        .main-container { max-width: 1400px; margin: 0 auto 80px auto; padding: 0 20px; }
        .grid-header { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sort-select {
            padding: 12px 24px; border-radius: 50px; background: #FFF; border: 3px solid var(--border-soft);
            color: var(--text-dark); font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.3s;
            box-shadow: var(--shadow-soft);
        }
        .sort-select:hover { border-color: var(--accent-peach); }

        .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }

        /* THIẾT KẾ THẺ PHÒNG TRỌ (HEALING THEME) */
        .bot-card {
            background: var(--bg-card); border-radius: 35px; overflow: hidden; position: relative;
            display: flex; flex-direction: column; box-shadow: var(--shadow-soft);
            border: 4px solid #FFF; transition: 0.4s; height: 100%;
        }
        .bot-card:hover { transform: translateY(-12px); box-shadow: 0 25px 45px rgba(92, 64, 51, 0.12); border-color: var(--border-soft); }
        
        .b-img-wrap { width: 100%; aspect-ratio: 9/16; position: relative; overflow: hidden; background: #FDECE4; }
        .b-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; border-radius: 30px 30px 0 0; }
        .bot-card:hover .b-img-wrap img { transform: scale(1.06); }

        /* Đánh giá sao */
        .b-rating {
            position: absolute; top: 18px; right: 18px; background: #FFF;
            color: var(--text-dark); padding: 8px 16px; border-radius: 50px; font-size: 1rem; font-weight: 900;
            box-shadow: 0 6px 15px rgba(92, 64, 51, 0.1); z-index: 2; display: flex; align-items: center; gap: 6px; 
            border: 3px solid var(--border-soft); font-family: var(--font-heading);
        }

        /* Chân thẻ */
        .b-info {
            padding: 25px; display: flex; flex-direction: column; flex: 1; position: relative; background: #FFF;
        }
        .b-header-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .b-avatar-mini { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-peach); }
        .b-name { font-family: var(--font-heading); font-size: 1.4rem; font-weight: 800; color: var(--text-dark); line-height: 1.2;}
        
        .b-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .b-tag { font-size: 0.75rem; padding: 6px 14px; background: var(--bg-main); border-radius: 50px; color: var(--text-dark); font-weight: 800; border: 2px solid var(--border-soft); }
        
        .b-hook { font-size: 1rem; color: var(--text-muted); font-style: italic; margin-bottom: 25px; flex: 1; font-weight: 700; line-height: 1.6;}
        
        .b-actions { display: flex; flex-direction: column; gap: 12px; margin-top: auto;}
        .b-btn { 
            width: 100%; padding: 15px; border-radius: 20px; font-size: 0.9rem; font-weight: 900; text-align: center; 
            transition: 0.3s; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px;
            font-family: var(--font-body); border: 3px solid transparent; cursor: pointer;
        }
        .b-btn-link { background: var(--accent-peach); color: #FFF; box-shadow: 0 8px 20px rgba(255,159,124,0.3); }
        .b-btn-link:hover { background: #FF8B61; transform: translateY(-3px); }
        .b-btn-fb { background: #FFF; color: var(--text-dark); border-color: var(--border-soft); }
        .b-btn-fb:hover { background: var(--bg-main); border-color: var(--accent-peach); transform: translateY(-2px);}

        /* ============================================================
           MODAL CHUNG & GÓC FEEDBACK
           ============================================================ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(92, 64, 51, 0.4); backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from {opacity:0; transform:scale(0.95);} to {opacity:1; transform:scale(1);} }
        
        .modal-content {
            background: #FFF; width: 100%; max-width: 750px; border-radius: 35px;
            overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;
            box-shadow: 0 25px 60px rgba(92, 64, 51, 0.15); border: 4px solid var(--border-soft);
        }
        .m-header {
            padding: 25px 35px; border-bottom: 3.5px dashed var(--border-soft); display: flex; justify-content: space-between; align-items: center; background: #FFF;
        }
        .m-title { font-family: var(--font-heading); font-size: 1.6rem; color: var(--text-dark); margin: 0; font-weight: 800; display:flex; align-items:center; gap:12px;}
        .m-close { font-size: 2rem; color: var(--text-muted); transition: 0.2s; font-weight: bold;}
        .m-close:hover { color: #EF4444; transform: rotate(90deg); }
        .m-body { padding: 35px; overflow-y: auto; flex: 1; background: var(--bg-main); }
        .m-body::-webkit-scrollbar { width: 10px; }
        .m-body::-webkit-scrollbar-thumb { background: var(--accent-mocha); border-radius: 20px; border: 2px solid var(--bg-main);}

        /* CỤM FEEDBACK FORM */
        .fb-form { background: #FFF; padding: 30px; border-radius: 25px; border: 3px solid var(--border-soft); margin-bottom: 35px; box-shadow: var(--shadow-soft); }
        .stars-select { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; cursor: pointer; }
        .star-svg { width: 40px; height: 40px; color: var(--border-soft); transition: 0.2s; }
        .star-svg.active { color: #F59E0B; filter: drop-shadow(0 5px 8px rgba(245, 158, 11, 0.3)); transform: scale(1.15); }
        
        .fb-input { width: 100%; padding: 16px 22px; background: var(--bg-main); border: 3px solid var(--border-soft); border-radius: 20px; color: var(--text-dark); margin-bottom: 18px; font-size: 1.05rem; font-weight: 700;}
        .fb-input:focus { border-color: var(--accent-peach); background:#FFF;}
        
        .fb-btn-submit { width: 100%; padding: 18px; background: var(--text-dark); color: #FFF; font-weight: 900; border-radius: 20px; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; font-size: 1.05rem; font-family: var(--font-body);}
        .fb-btn-submit:hover { background: var(--accent-peach); transform: translateY(-4px); box-shadow: 0 10px 25px rgba(255,159,124,0.4);}
        
        .file-upload-label { display: inline-block; padding: 16px 20px; background: #FFF; border: 3px dashed var(--accent-mocha); border-radius: 20px; font-size: 1rem; color: var(--text-dark); font-weight: 800; cursor: pointer; margin-bottom: 20px; transition: 0.3s; width:100%; text-align:center;}
        .file-upload-label:hover { background: var(--bg-main); border-color: var(--accent-peach); }
        .img-preview { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px;}
        .img-preview img { width: 85px; height: 85px; object-fit: cover; border-radius: 16px; border: 3px solid var(--accent-mocha); }

        /* DANH SÁCH FEEDBACK */
        .fb-list { display: flex; flex-direction: column; gap: 25px; }
        .fb-item { background: #FFF; padding: 25px; border-radius: 25px; border: 3px solid var(--border-soft); box-shadow: var(--shadow-soft); position: relative;}
        .fb-item-header { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center;}
        .fb-item-name { font-weight: 900; color: var(--text-dark); font-size: 1.25rem; display:flex; align-items:center; gap:12px; font-family: var(--font-heading);}
        .fb-item-stars { display: flex; gap: 3px; }
        .fb-item-text { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; margin-bottom: 20px; font-weight: 700;}
        .fb-item-imgs { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;}
        .fb-item-imgs img { width: 110px; height: 110px; object-fit: cover; border-radius: 16px; cursor: zoom-in; border: 3px solid var(--border-soft);}
        .fb-del-btn { background: #FFF; color: #EF4444; border: 2.5px solid #EF4444; padding: 6px 14px; font-size: 0.85rem; font-weight:900; border-radius: 50px; position:absolute; top: 20px; right: 20px; transition: 0.2s;}
        .fb-del-btn:hover { background: #EF4444; color: #FFF; }

        /* BÌNH LUẬN CON (REP) */
        .reply-section { border-top: 3px dashed var(--border-soft); padding-top: 25px; }
        .reply-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;}
        .reply-item { background: var(--bg-main); padding: 18px 22px; border-radius: 20px; font-size: 1rem; color: var(--text-dark); position:relative; border: 2px solid var(--border-soft); font-weight: 600;}
        .reply-name { font-weight: 800; margin-bottom: 8px; display:flex; justify-content:space-between; font-size: 1.05rem; font-family: var(--font-heading);}
        .reply-time { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-top: 8px;}
        .reply-input-wrap { display: flex; gap: 12px; }
        .reply-input { flex: 1; padding: 14px 20px; border-radius: 50px; border: 3px solid var(--border-soft); font-size: 0.95rem; font-weight: 700;}
        .reply-input:focus { border-color: var(--accent-mocha); outline: none;}
        .reply-btn { padding: 14px 28px; background: var(--text-dark); color: #FFF; font-weight: 900; border-radius: 50px; font-size: 0.95rem; transition: 0.3s;}
        .reply-btn:hover { background: var(--accent-peach); transform: translateY(-2px);}

        /* ============================================================
           ADMIN PANEL & NOTIFICATION BELL
           ============================================================ */
        .admin-bar {
            position: fixed; top: 0; left: 0; right: 0; background: #FFF;
            padding: 12px 25px; z-index: 9999; display: none; justify-content: space-between; align-items: center; 
            box-shadow: 0 5px 25px rgba(92, 64, 51, 0.08); border-bottom: 3px solid var(--border-soft);
        }
        body.is-admin .admin-bar { display: flex; }
        .admin-controls { display: flex; gap: 12px; align-items: center;}
        .btn-ad { padding: 10px 20px; background: var(--bg-main); color: var(--text-dark); border-radius: 50px; font-size: 0.9rem; font-weight: 800; border: 2.5px solid var(--border-soft); transition: 0.3s;}
        .btn-ad:hover { background: var(--accent-peach); color: #FFF; border-color: var(--accent-peach); transform: translateY(-2px);}
        .btn-ad.danger { background: #FFF; border-color: #EF4444; color: #EF4444;}
        .btn-ad.danger:hover { background: #EF4444; color: #FFF;}
        
        /* Chuông thông báo */
        .noti-btn { position: relative; cursor: pointer; color: var(--text-dark); display:flex; align-items:center; justify-content:center; padding: 10px; background: var(--bg-main); border-radius:50%; border: 3px solid var(--border-soft); transition:0.3s;}
        .noti-btn:hover { background: var(--accent-mocha); border-color: var(--accent-mocha); color: #FFF;}
        .noti-badge { position: absolute; top: -8px; right: -8px; background: #EF4444; color: #FFF; font-size: 0.75rem; width: 24px; height: 24px; display:flex; align-items:center; justify-content:center; border-radius: 50%; font-weight: 900; border: 3px solid #FFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15);}

        /* Khung Admin gắn trên thẻ */
        .card-admin-overlay { position: absolute; top: 15px; left: 15px; z-index: 20; display: none; gap: 8px; flex-direction: column;}
        body.is-admin .card-admin-overlay { display: flex; }
        .btn-card-ad { background: #FFF; color: var(--text-dark); border: 3px solid var(--text-dark); padding: 8px 14px; font-size: 0.85rem; font-weight:900; border-radius: 50px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); transition:0.3s;}
        .btn-card-ad:hover { background: var(--accent-peach); color:#FFF; border-color:var(--accent-peach); transform: translateY(-3px);}

        /* Form Admin Popup */
        .admin-modal { position: fixed; inset: 0; background: rgba(92, 64, 51, 0.7); backdrop-filter: blur(8px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px;}
        .admin-modal.show { display: flex; }
        .admin-modal-box { background: #FFF; width: 100%; max-width: 750px; padding: 40px; border-radius: 35px; max-height: 90vh; overflow-y: auto; color: var(--text-dark); border: 4px solid var(--border-soft); box-shadow: 0 25px 60px rgba(0,0,0,0.2);}
        .admin-form-group { margin-bottom: 25px; }
        .admin-form-group label { display: block; font-weight: 800; margin-bottom: 12px; font-size: 1.05rem; color: var(--text-dark);}
        
        /* ============================================================
           THIẾT KẾ THẺ SẮP RA MẮT (UPCOMING BOTS)
           ============================================================ */
        .up-card {
            background: var(--bg-card); border: 4px dashed var(--accent-peach); border-radius: 35px; padding: 35px 25px;
            display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
            box-shadow: var(--shadow-soft);
        }
        .up-avatar-wrap { position:relative; margin-bottom: 25px; }
        .up-avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; filter: blur(3px) grayscale(0.2); border: 5px solid #FFF; box-shadow: 0 10px 25px rgba(92, 64, 51, 0.15);}
        
        .up-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); background: #EF4444; color: #FFF; font-weight: 900; font-size: 1rem; padding: 8px 20px; border: 3.5px solid #FFF; border-radius: 12px; white-space: nowrap; box-shadow: 0 6px 15px rgba(0,0,0,0.2); z-index: 2; letter-spacing: 1.5px;}
        .up-name { font-family: var(--font-heading); font-size: 1.8rem; font-weight:800; color: var(--text-dark); margin-bottom: 12px;}
        .up-idea { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.7; font-style:italic; font-weight:700;}
        
        .up-progress-wrap { width: 100%; margin-bottom: 25px; text-align: left; background: var(--bg-main); padding: 20px; border-radius: 20px; border: 3px solid var(--border-soft);}
        .up-p-header { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-dark); margin-bottom: 12px; font-weight:900;}

</head>
<body>

    <!-- THANH ADMIN -->
    <div class="admin-bar">

    <!-- LIGHTBOX (Zoom ảnh) -->

    <!-- MODAL FORM ADMIN -->
    <div class="admin-modal" id="admin-modal">
        <div class="admin-modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom: 25px;">
                <h2 id="admin-form-title" style="font-family:var(--font-heading); color:var(--text-dark); font-size: 1.8rem; font-weight:800;">Tiêu Đề Form</h2>
                <button onclick="document.getElementById('admin-modal').classList.remove('show')" style="font-size:2rem; font-weight:bold; color:#EF4444; border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div id="admin-form-body"></div>
        </div>
    </div>

    <script>
        /* ============================================================
           CƠ SỞ DỮ LIỆU & TRẠNG THÁI (CAPY STATION V2)
           ============================================================ */
        let CONFIG = {
            stationMaster: { bio: "Nơi đàn Capybara ngâm mình ven suối, cùng lữ khách bước vào những thế giới mở rộng lớn...", rules: "Hãy lịch sự và yêu thương động vật nhé!", avatar: "ChatGPT_Image_18_19_44_30_thg_7__2026-removebg-preview.png" },
            staff: [], // {id, name, avatar, hook, tags, link, feedbacks: [{id, name, stars, text, imgs, date, replies:[]}], isHidden, createdAt}
            upcomingBots: [] // {id, name, avatar, idea, train, progress, note, votes, isHidden}
        };
        
        let isAdminMode = false;
        let activeRouteFilter = "all";
        let searchQuery = "";

        // Kết nối Supabase (ID 777 để làm mới hoàn toàn)
        const SUPABASE_URL = "https://gmejjxvahnqqrhihahid.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZWpqeHZhaG5xcXJoaWhhaGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTM5OTQsImV4cCI6MjA5OTMyOTk5NH0.Q1uit-9R_Lrs0uM_Azgbn9GGKMoyFl-cFfl3M7IeSMU";
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ============================================================
           TIỆN ÍCH CHUNG
           ============================================================ */
        function removeAccents(str) { return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() : ''; }
        function openLightbox(src, e) { e.stopPropagation(); document.getElementById("lightbox-img").src = src; document.getElementById("lightbox").style.display="flex"; }
        function closeModal(force = false) { 
            if(force || event.target.id === 'main-modal') {
                document.getElementById("main-modal").classList.remove("show"); 
                document.body.style.overflow = "auto";
            }
        }
        
        async function resizeImage(file, maxSize = 1000) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onload = (e) => { 
                    const img = new Image(); 
                    img.onload = () => { 
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height; 
                        if(w > maxSize || h > maxSize) { if(w > h) { h = Math.round((h * maxSize) / w); w = maxSize; } else { w = Math.round((w * maxSize) / h); h = maxSize; } } 
                        canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', 0.85)); 
                    }; img.src = e.target.result; 
                }; reader.readAsDataURL(file); 
            }); 
        }

        // Tính sao trung bình chuẩn
        function getAvgRating(bot) {
            if(!bot.feedbacks || bot.feedbacks.length === 0) return 5.0;
            let sum = bot.feedbacks.reduce((acc, curr) => acc + curr.stars, 0);
            return (sum / bot.feedbacks.length).toFixed(1);
        }

        /* ============================================================
           ĐỒNG BỘ DỮ LIỆU CHÍNH
           ============================================================ */
        async function fetchConfig() {
            try {
                const { data } = await supa.from('station_config').select('data').eq('id', 777).single();
                if (data && data.data) {
                    CONFIG = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
                } else {
                    let localBackup = await localforage.getItem("capy_config_v2");
                    if (localBackup) CONFIG = { ...CONFIG, ...localBackup };
                }

                if(!Array.isArray(CONFIG.staff)) CONFIG.staff = [];
                if(!Array.isArray(CONFIG.upcomingBots)) CONFIG.upcomingBots = [];
                
                CONFIG.staff.forEach(s => { 
                    if(!Array.isArray(s.feedbacks)) s.feedbacks = []; 
                    s.feedbacks.forEach(f => { if(!Array.isArray(f.replies)) f.replies = []; if(!f.id) f.id = Date.now()+Math.random(); });
                });

                renderUI();
                checkNotifications();
            } catch(e) { console.error("Lỗi lấy dữ liệu:", e); renderUI(); }
        }

        async function saveConfig() {
            try {
                await localforage.setItem("capy_config_v2", CONFIG);
                await supa.from('station_config').upsert([{ id: 777, data: JSON.stringify(CONFIG) }]);
            } catch(e) { console.error("Lỗi lưu DB:", e); }
        }

        /* ============================================================
           RENDER GIAO DIỆN CHÍNH
           ============================================================ */
        function renderUI() {
            const bioText = CONFIG.stationMaster.bio || "Ở rìa của thực tại, nơi đàn Capybara ngâm mình ven suối...";
            document.getElementById("station-bio").innerHTML = `<svg class="svg-icon" viewBox="0 0 16 16" style="width:18px; height:18px; margin-right:5px; color:var(--accent-pink);"><use href="#px-ribbon"></use></svg> ${bioText} <svg class="svg-icon" viewBox="0 0 16 16" style="width:18px; height:18px; margin-left:5px; color:var(--accent-pink);"><use href="#px-ribbon"></use></svg>`;
            
            renderTags();
            renderGrid();
        }

        // TỰ ĐỘNG TẠO NÚT TAG TỪ DỮ LIỆU BOT
        function renderTags() {
            const container = document.getElementById("route-tags-container");
            container.innerHTML = "";

            let uniqueTags = new Set();
            CONFIG.staff.forEach(b => { 
                if(!b.isHidden || isAdminMode) {
                    if(b.tags && Array.isArray(b.tags)) {
                        b.tags.forEach(t => {
                            if(t.trim()) uniqueTags.add(t.trim().replace(/^#/, '')); // Bỏ dấu #
                        });
                    }
                } 
            });

            const allBtn = document.createElement("button");
            allBtn.className = `pill-tag ${activeRouteFilter === 'all' ? 'active' : ''}`;
            allBtn.textContent = "Tất cả";
            allBtn.onclick = () => { activeRouteFilter = 'all'; renderUI(); };
            container.appendChild(allBtn);

            Array.from(uniqueTags).sort().forEach(tag => {
                const btn = document.createElement("button");
                btn.className = `pill-tag ${activeRouteFilter === tag ? 'active' : ''}`;
                btn.textContent = "#" + tag;
                btn.onclick = () => { activeRouteFilter = tag; renderUI(); };
                container.appendChild(btn);
            });
        }

        function renderGrid() {
            const grid = document.getElementById("bot-grid");
            grid.innerHTML = "";
            const sortMode = document.getElementById("sort-select").value;
            const q = removeAccents(searchQuery);

            let displayBots = CONFIG.staff.filter(b => {
                if(b.isHidden && !isAdminMode) return false;
                
                let isMatchSearch = true;
                if(q !== "") {
                    const matchName = removeAccents(b.name).includes(q);
                    const matchTags = (b.tags||[]).some(t => removeAccents(t).includes(q));
                    if(!matchName && !matchTags) isMatchSearch = false;
                }

                let isMatchTag = true;
                if(activeRouteFilter !== 'all') {
                    const botCleanTags = (b.tags||[]).map(t => t.trim().replace(/^#/, ''));
                    if(!botCleanTags.includes(activeRouteFilter)) isMatchTag = false;
                }

                return isMatchSearch && isMatchTag;
            });

            displayBots.sort((a,b) => {
                if(sortMode === 'rating') return getAvgRating(b) - getAvgRating(a);
                return (b.createdAt || 0) - (a.createdAt || 0);
            });

            if(displayBots.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-muted); width:100%; text-align:center; padding: 40px; font-weight:800; font-size:1.2rem;'><svg class='svg-icon' viewBox='0 0 16 16'><use href='#px-paw'></use></svg> Hiện không có phòng nào phù hợp.</p>"; return;
            }

            displayBots.forEach(bot => {
                const card = document.createElement("div");
                card.className = "bot-card";
                
                let adminOver = isAdminMode ? `
                    <div class="card-admin-overlay">
                        <button class="btn-card-ad" onclick="openAdminForm('bot', 'edit', '${bot.id}'); event.stopPropagation();">Sửa</button>
                        <button class="btn-card-ad" onclick="toggleHideBot('${bot.id}', event)">${bot.isHidden ? 'Đang Ẩn' : 'Hiện'}</button>
                        <button class="btn-card-ad" style="color:#EF4444; border-color:#EF4444;" onclick="deleteBot('${bot.id}', event)">Xóa</button>
                    </div>
                ` : "";

                let tagsHtml = (bot.tags||[]).slice(0,3).map(t => `<span class="b-tag">${t.startsWith('#')?t:'#'+t}</span>`).join('');
                let rating = getAvgRating(bot);

                card.innerHTML = `
                    ${adminOver}
                    
                    <div class="b-img-wrap">
                        <img src="${bot.avatar || ''}" loading="lazy">
                        <div class="b-rating">
                            <svg class="svg-icon" viewBox="0 0 16 16" style="width:20px;height:20px;"><use href="#px-star-filled"></use></svg> 
                            ${rating}
                        </div>
                    </div>
                    
                    <div class="b-info">
                        <div class="b-header-info">
                            <img src="${bot.avatar || ''}" class="b-avatar-mini">
                            <div class="b-name">${bot.name}</div>
                        </div>
                        <div class="b-tags">${tagsHtml}</div>
                        <div class="b-hook">"${bot.hook || '...'}"</div>
                        
                        <div class="b-actions">
                            <button class="b-btn b-btn-fb" onclick="openFeedbackModal('${bot.id}'); event.stopPropagation();">💬 Góc Feedback (${bot.feedbacks.length})</button>
                            ${bot.link ? `<a href="${bot.link}" target="_blank" class="b-btn b-btn-link" onclick="event.stopPropagation();"><svg class="svg-icon" viewBox="0 0 16 16" style="width:20px;height:20px;color:#FFF"><use href="#px-key"></use></svg> Ghé Thăm Phòng</a>` : `<button class="b-btn b-btn-link" style="opacity:0.5; cursor:not-allowed;" onclick="event.stopPropagation();">ĐANG DỌN PHÒNG</button>`}
                        </div>

                        <!-- Con dấu Capy Pixel -->
                        <svg class="b-seal svg-icon" viewBox="0 0 16 16" style="position:absolute; bottom:15px; right:15px; width:45px; height:45px; color:var(--accent-peach); opacity:0.8;"><use href="#px-paw"></use></svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById("search-inp").addEventListener("input", e => { searchQuery = e.target.value.trim(); renderGrid(); });
        document.getElementById("sort-select").addEventListener("change", renderGrid);

        /* ============================================================
           MỞ MODAL: GÓC FEEDBACK
           ============================================================ */
        let tempFbImgs = [];
        let currentStars = 0;

        window.openFeedbackModal = function(botId) {
            const bot = CONFIG.staff.find(b => b.id === botId);
            if(!bot) return;
            tempFbImgs = []; currentStars = 0;
            
            document.getElementById("modal-title").innerHTML = `💬 GÓC FEEDBACK: <span style="color:var(--accent-peach)">${bot.name.toUpperCase()}</span>`;
            const body = document.getElementById("modal-body");
            
            // Render Danh sách Feedbacks
            let fbListHtml = "";
            if(!bot.feedbacks || bot.feedbacks.length === 0) {
                fbListHtml = "<p style='color:var(--text-muted); font-style:italic; text-align:center; font-size:1.1rem; font-weight:700;'>Chưa có lữ khách nào ghé thăm. Hãy là người đầu tiên!</p>";
            } else {
                let sortedFb = [...bot.feedbacks].sort((a,b) => b.date - a.date);
                fbListHtml = sortedFb.map((fb) => {
                    let imgsHtml = (fb.imgs||[]).map(src => `<img src="${src}" onclick="openLightbox(this.src, event)">`).join('');
                    let delBtn = isAdminMode ? `<button class="fb-del-btn" onclick="deleteFeedback('${botId}', '${fb.id}')">✕ Xóa FB</button>` : '';
                    
                    // Xử lý Rep
                    let repliesHtml = (fb.replies||[]).map((r, rIdx) => {
                        let delRepBtn = isAdminMode ? `<button style="background:none; border:none; color:#EF4444; font-size:0.8rem; font-weight:900; cursor:pointer;" onclick="deleteReply('${botId}', '${fb.id}', ${rIdx})">Xóa</button>` : '';
                        let nameColor = r.name.toLowerCase() === 'chủ trọ' ? 'color:var(--accent-peach);' : 'color:var(--text-dark);';
                        return `
                            <div class="reply-item">
                                <div class="reply-name"><span style="${nameColor}">${r.name}</span> <span>${delRepBtn}</span></div>
                                <div>${r.text}</div>
                                <div class="reply-time">${new Date(r.date).toLocaleString('vi-VN')}</div>
                            </div>
                        `;
                    }).join('');

                    let replyInputHtml = `
                        <div class="reply-input-wrap">
                            <input type="text" id="rep-name-${fb.id}" class="reply-input" placeholder="Tên..." style="width:110px; flex:none;">
                            <input type="text" id="rep-text-${fb.id}" class="reply-input" placeholder="Viết phản hồi..." onkeypress="if(event.key==='Enter') sendReply('${botId}', '${fb.id}')">
                            <button class="reply-btn" onclick="sendReply('${botId}', '${fb.id}')">GỬI</button>
                        </div>
                    `;

                    let starsVisual = "";
                    for(let i=0; i<5; i++) {
                        starsVisual += i < fb.stars 
                            ? `<svg class="svg-icon" viewBox="0 0 16 16" style="width:20px;height:20px;color:#F59E0B"><use href="#px-star-filled"></use></svg>`
                            : `<svg class="svg-icon" viewBox="0 0 16 16" style="width:20px;height:20px;color:var(--border-soft)"><use href="#px-star-empty"></use></svg>`;
                    }

                    return `
                        <div class="fb-item">
                            ${delBtn}
                            <div class="fb-item-header">
                                <span class="fb-item-name"><img src="${bot.avatar}" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border: 2.5px solid var(--accent-mocha);"> ${fb.name}</span>
                                <span class="fb-item-stars">${starsVisual}</span>
                            </div>
                            <div class="fb-item-text">${fb.text}</div>
                            ${imgsHtml ? `<div class="fb-item-imgs">${imgsHtml}</div>` : ''}
                            
                            <div class="reply-section">
                                <div class="reply-list">${repliesHtml}</div>
                                ${replyInputHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            let formStarsHtml = "";
            for(let i=1; i<=5; i++) {
                formStarsHtml += `<svg class="svg-icon star-svg star-item" data-val="${i}" viewBox="0 0 16 16"><use href="#px-star-empty"></use></svg>`;
            }

            body.innerHTML = `
                <div class="fb-form">
                    <div style="text-align:center; margin-bottom:15px; color:var(--text-muted); font-weight:800; font-size:1.1rem;">CHẤM ĐIỂM TRẢI NGHIỆM TẠI PHÒNG NÀY</div>
                    <div class="stars-select" id="star-wrap">${formStarsHtml}</div>
                    <input type="text" id="fb-name" class="fb-input" placeholder="Tên của bạn (Tùy chọn, mặc định: Lữ Khách)...">
                    <textarea id="fb-text" class="fb-input" placeholder="Viết cảm nhận của bạn về phòng trọ này..." style="height:120px;" required></textarea>
                    
                    <label class="file-upload-label"><input type="file" accept="image/*" multiple id="fb-file" style="display:none;"> 📸 Bấm để chọn ảnh minh chứng (Tối đa 3 ảnh)</label>
                    <div class="img-preview" id="fb-preview"></div>
                    
                    <button class="fb-btn-submit" id="fb-submit-btn">GỬI FEEDBACK CHÂN THỰC</button>
                </div>
                <div style="font-family:var(--font-heading); font-size:1.6rem; color:var(--text-dark); margin-bottom:20px; font-weight:800; border-bottom:3.5px dashed var(--border-soft); padding-bottom:15px;">GÓC TÁM CHUYỆN</div>
                <div class="fb-list" id="fb-list-wrap">${fbListHtml}</div>
            `;

            const starItems = body.querySelectorAll('.star-item');
            starItems.forEach((s, idx) => {
                s.onclick = () => {
                    currentStars = parseInt(s.dataset.val);
                    starItems.forEach((st, stIdx) => {
                        if(stIdx < currentStars) { 
                            st.innerHTML = '<use href="#px-star-filled"></use>'; 
                            st.classList.add('active'); 
                        } else { 
                            st.innerHTML = '<use href="#px-star-empty"></use>'; 
                            st.classList.remove('active'); 
                        }
                    });
                };
            });

            document.getElementById("fb-file").onchange = async (e) => {
                const prev = document.getElementById("fb-preview");
                if(e.target.files.length + tempFbImgs.length > 3) return alert("Chỉ được gửi tối đa 3 ảnh!");
                prev.innerHTML = "<span style='color:var(--text-dark); font-size:13px; font-weight:800;'>Đang xử lý ảnh...</span>";
                for(let f of e.target.files) { tempFbImgs.push(await resizeImage(f, 1000)); }
                prev.innerHTML = tempFbImgs.map((src, i) => `<div style="position:relative;"><img src="${src}"><button style="position:absolute;top:-8px;right:-8px;background:#EF4444;color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;font-weight:900;border:none;cursor:pointer;box-shadow:0 3px 5px rgba(0,0,0,0.2);" onclick="removeFbImg(${i}, '${botId}')">✕</button></div>`).join('');
            };

            document.getElementById("fb-submit-btn").onclick = async () => {
                if(currentStars === 0) return alert("Vui lòng chấm điểm (Sao) cho phòng này!");
                const text = document.getElementById("fb-text").value.trim();
                if(!text && tempFbImgs.length === 0) return alert("Vui lòng viết vài dòng cảm nhận hoặc gửi ảnh!");
                
                const name = document.getElementById("fb-name").value.trim() || "Lữ Khách";
                
                bot.feedbacks.push({ id: "fb_"+Date.now(), name: name, stars: currentStars, text: text, imgs: [...tempFbImgs], date: Date.now(), replies: [] });
                
                document.getElementById("fb-submit-btn").textContent = "ĐANG GỬI...";
                await saveConfig();
                renderUI(); 
                openFeedbackModal(botId);
            };

            if(isAdminMode) {
                body.querySelectorAll("input[id^='rep-name-']").forEach(inp => inp.value = "Chủ Trọ");
            }

            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.removeFbImg = function(idx, botId) { tempFbImgs.splice(idx, 1); const prev = document.getElementById("fb-preview"); prev.innerHTML = tempFbImgs.map((src, i) => `<div style="position:relative;"><img src="${src}"><button style="position:absolute;top:-8px;right:-8px;background:#EF4444;color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;font-weight:900;border:none;cursor:pointer;box-shadow:0 3px 5px rgba(0,0,0,0.2);" onclick="removeFbImg(${i}, '${botId}')">✕</button></div>`).join(''); }

        window.sendReply = async function(botId, fbId) {
            const nameInput = document.getElementById(`rep-name-${fbId}`);
            const textInput = document.getElementById(`rep-text-${fbId}`);
            if(!textInput.value.trim()) return;

            const bot = CONFIG.staff.find(b => b.id === botId);
            const fb = bot.feedbacks.find(f => f.id === fbId);
            if(fb) {
                fb.replies.push({ name: nameInput.value.trim() || "Khách", text: textInput.value.trim(), date: Date.now() });
                await saveConfig();
                openFeedbackModal(botId);
            }
        };

        window.deleteFeedback = async function(botId, fbId) {
            if(!confirm("Xóa vĩnh viễn feedback này?")) return;
            const bot = CONFIG.staff.find(b => b.id === botId);
            bot.feedbacks = bot.feedbacks.filter(f => f.id !== fbId);
            await saveConfig(); renderUI(); openFeedbackModal(botId);
        };
        window.deleteReply = async function(botId, fbId, rIdx) {
            if(!confirm("Xóa phản hồi này?")) return;
            const bot = CONFIG.staff.find(b => b.id === botId);
            const fb = bot.feedbacks.find(f => f.id === fbId);
            fb.replies.splice(rIdx, 1);
            await saveConfig(); openFeedbackModal(botId);
        };

        /* ============================================================
           MỞ MODAL: SẮP RA MẮT & CHỦ QUÁN
           ============================================================ */
        window.openSMModal = function() {
            document.getElementById("modal-title").innerHTML = `<img src="ChatGPT_Image_18_21_28_30_thg_7__2026-removebg-preview.png" style="width:30px;height:30px;"> THÔNG TIN CHỦ TRỌ`;
            let fbHtml = CONFIG.stationMaster.facebook && CONFIG.stationMaster.facebook.url ? `<div style="margin-top:25px; text-align:center;"><a href="${CONFIG.stationMaster.facebook.url}" target="_blank" style="display:inline-block; padding:16px 32px; background:var(--text-dark); color:#FFF; font-weight:900; border-radius:50px; box-shadow:0 8px 25px rgba(92, 64, 51, 0.25); font-family:var(--font-body); font-size:1.05rem;">Liên hệ Facebook Chủ Trọ</a></div>` : '';
            
            document.getElementById("modal-body").innerHTML = `
                <div style="text-align:center; margin-bottom:30px;">
                    ${CONFIG.stationMaster.avatar ? `<img src="${CONFIG.stationMaster.avatar}" style="width:160px; height:160px; border-radius:50%; object-fit:cover; margin:0 auto; border:4px solid var(--accent-peach); box-shadow:var(--shadow-soft);">` : ''}
                </div>
                <div style="white-space:pre-wrap; color:var(--text-dark); font-size:1.15rem; font-weight:700; text-align:center; background:#FFF; padding:30px; border-radius:30px; border:3.5px dashed var(--accent-mocha); margin-bottom:25px; box-shadow:var(--shadow-soft);">${CONFIG.stationMaster.bio}</div>
                
                <h3 style="font-family:var(--font-heading); margin-top:35px; margin-bottom:15px; color:var(--text-dark); font-size:1.5rem; font-weight:800;">📌 Quy tắc của Quán:</h3>
                <div style="white-space:pre-wrap; color:var(--text-muted); font-size:1.05rem; background:var(--bg-main); padding:25px; border-radius:24px; font-weight:700; border: 3px solid var(--border-soft);">${CONFIG.stationMaster.rules}</div>
                ${fbHtml}
            `;
            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.openUpcomingModal = function() {
            document.getElementById("modal-title").innerHTML = `<svg class="svg-icon" viewBox="0 0 16 16"><use href="#px-gift"></use></svg> PHÒNG SẮP RA MẮT`;
            const body = document.getElementById("modal-body");
            
            let displayBots = CONFIG.upcomingBots.filter(b => !b.isHidden || isAdminMode);
            displayBots.sort((a,b) => (b.progress - a.progress) || (b.votes - a.votes));

            if(displayBots.length === 0) {
                body.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding:50px; font-weight:800; font-size:1.2rem;'><svg class='svg-icon' viewBox='0 0 16 16'><use href='#px-paw'></use></svg> Khu vực đang dọn dẹp, chưa có phòng mới nào.</p>";
            } else {
                let html = `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:35px;">`;
                displayBots.forEach(bot => {
                    let adminOver = isAdminMode ? `<div class="card-admin-overlay"><button class="btn-card-ad" onclick="openAdminForm('up', 'edit', '${bot.id}')">Sửa</button><button class="btn-card-ad" onclick="toggleHideUp('${bot.id}')">${bot.isHidden?'Đang Ẩn':'Hiện'}</button><button class="btn-card-ad" style="color:#EF4444; border-color:#EF4444;" onclick="deleteUp('${bot.id}')">Xóa</button></div>` : '';
                    let hasVoted = localStorage.getItem('vote_up_' + bot.id) === 'true';
                    
                    html += `
                        <div class="up-card">
                            ${adminOver}
                            <div class="up-stamp">SẮP RA MẮT</div>
                            
                            <div class="up-avatar-wrap">
                                <img src="${bot.avatar}" class="up-avatar">
                                <img src="2D_pixel_png-removebg-preview.png" class="up-bow" style="position:absolute; top:-15px; right:-15px; width:60px;">
                            </div>
                            
                            <div class="up-name">${bot.name}</div>
                            <div class="up-idea">"${bot.idea}"</div>
                            
                            <div class="up-progress-wrap">
                                <div class="up-p-header"><span>Hoàn thiện:</span><span>${bot.progress}%</span></div>
                                <div class="up-p-bar"><div class="up-p-fill" style="width:${bot.progress}%"></div></div>
                                ${bot.progressNote ? `<div class="up-p-header" style="color:var(--text-muted); margin-top:10px; font-style:italic; font-size:0.9rem; font-weight:700;">➤ ${bot.progressNote}</div>` : ''}
                            </div>
                            
                            <button class="up-vote-btn ${hasVoted?'voted':''}" onclick="voteUp('${bot.id}')">
                                ${hasVoted ? '❤️ Đã gửi tình yêu' : '🤍 Chấm hóng'} (${bot.votes || 0})
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
                body.innerHTML = html;
            }

            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.voteUp = async function(id) {
            if(localStorage.getItem('vote_up_' + id) === 'true') return;
            let bot = CONFIG.upcomingBots.find(b => b.id === id);
            if(bot) {
                bot.votes = (bot.votes || 0) + 1;
                localStorage.setItem('vote_up_' + id, 'true');
                await saveConfig(); openUpcomingModal();
            }
        };

        /* ============================================================
           QUẢN LÝ ADMIN (MỞ KHÓA BẰNG TOUCH/CLICK)
           ============================================================ */
        let lastTap = 0;
        document.getElementById("trigger-admin").addEventListener("click", (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            // Nhấp đúp thành công (Thời gian giữa 2 lần chạm liên tiếp < 400ms)
            if (tapLength < 400 && tapLength > 0) {
                if(!isAdminMode) { 
                    if(prompt("Mật mã Chủ Trọ:") === "bhnt2006") { 
                        isAdminMode = true; document.body.classList.add("is-admin"); renderUI(); checkNotifications(); 
                    } 
                } else {
                    if(confirm("Thoát chế độ Admin?")) exitAdmin();
                }
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        function exitAdmin() { isAdminMode = false; document.body.classList.remove("is-admin"); renderUI(); document.getElementById("noti-badge").style.display="none"; }

        window.toggleHideBot = async function(id, e) { e.stopPropagation(); let b = CONFIG.staff.find(x => x.id === id); if(b) { b.isHidden = !b.isHidden; await saveConfig(); renderUI(); } };
        window.deleteBot = async function(id, e) { e.stopPropagation(); if(confirm("Xóa vĩnh viễn phòng này?")) { CONFIG.staff = CONFIG.staff.filter(x => x.id !== id); await saveConfig(); renderUI(); } };
        window.toggleHideUp = async function(id) { let b = CONFIG.upcomingBots.find(x => x.id === id); if(b) { b.isHidden = !b.isHidden; await saveConfig(); openUpcomingModal(); } };
        window.deleteUp = async function(id) { if(confirm("Xóa thẻ dự bị này?")) { CONFIG.upcomingBots = CONFIG.upcomingBots.filter(x => x.id !== id); await saveConfig(); openUpcomingModal(); } };

            if (type === 'sm') {
                body.innerHTML = `

                    <div id="ad-sm-prev" style="text-align:center; margin-bottom:20px;">${CONFIG.stationMaster.avatar ? `<img src="${CONFIG.stationMaster.avatar}" style="height:120px; border-radius:50%; border:4px solid var(--accent-peach);">` : ''}</div>

                    <div class="admin-form-group">

                        <textarea id="ad-rules" style="height:140px;">${CONFIG.stationMaster.rules}</textarea>
                    </div>
                    <div class="admin-form-group">
                        <label>Tên hiển thị FB</label>
                        <input type="text" id="ad-fbname" value="${CONFIG.stationMaster.facebook?.name || ''}">
                    </div>
                    <div class="admin-form-group">
                        <label>Link FB</label>
                        <input type="text" id="ad-fburl" value="${CONFIG.stationMaster.facebook?.url || ''}">
                    </div>
                    <button class="fb-btn-submit" id="ad-save">LƯU LẠI THÔNG TIN</button>
                `;
                tempAdminImg = CONFIG.stationMaster.avatar || "ChatGPT_Image_18_19_44_30_thg_7__2026-removebg-preview.png";
                document.getElementById("ad-sm-img").onchange = async (e) => {
                    if(e.target.files.length > 0) { tempAdminImg = await resizeImage(e.target.files[0], 800); document.getElementById("ad-sm-prev").innerHTML = `<img src="${tempAdminImg}" style="height:120px; border-radius:50%; border:4px solid var(--accent-peach);">`; }
                };
                document.getElementById("ad-save").onclick = async () => {
                    CONFIG.stationMaster.avatar = tempAdminImg;
                    CONFIG.stationMaster.bio = document.getElementById("ad-bio").value;
                    CONFIG.stationMaster.rules = document.getElementById("ad-rules").value;
                    CONFIG.stationMaster.facebook = { name: document.getElementById("ad-fbname").value, url: document.getElementById("ad-fburl").value };
                    await saveConfig(); renderUI(); document.getElementById("admin-modal").classList.remove("show"); alert("Đã lưu Chủ Trọ!");

            else if (type === 'bot') {
                let d = { name: "", hook: "", link: "", tags: [] };
                if (action === 'edit') { const b = CONFIG.staff.find(x => x.id === id); if(b) { d = b; tempAdminImg = b.avatar; } }
                
                body.innerHTML = `
                    <div class="admin-form-group"><label>Tên Phòng (OC)</label><input type="text" id="ad-name" value="${d.name}"></div>
                    
                    <label class="file-upload-label" style="width:100%; text-align:center;"><input type="file" accept="image/*" id="ad-img" style="display:none;"> 📸 TẢI ẢNH (CHÂN DUNG DỌC 9:16)</label>
                    <div id="ad-prev" style="text-align:center; margin-bottom:20px;">${tempAdminImg ? `<img src="${tempAdminImg}" style="height:160px; border-radius:16px; border:3px solid var(--accent-mocha);">` : ''}</div>
                    
                    <div class="admin-form-group">
                        <label>Tags (Cách nhau dấu phẩy)</label>
                        <p style="font-size:0.85rem; color:var(--text-muted); margin-top:-5px; margin-bottom:10px; font-weight:600;">*Lưu ý: Tag bạn nhập sẽ tự động thành cục thuốc lọc ở trang chủ.</p>
                        <input type="text" id="ad-tags" value="${(d.tags||[]).join(', ')}">

                    <div class="admin-form-group"><label>Câu thoại mồi (Hook)</label><textarea id="ad-hook" style="height:100px;">${d.hook}</textarea></div>
                    <div class="admin-form-group"><label>Link Web Chi Tiết (Nhấn nút Ghé Phòng sẽ ra link này)</label><input type="text" id="ad-link" value="${d.link || ''}" placeholder="https://..."></div>
                    
                    <button class="fb-btn-submit" id="ad-save">LƯU PHÒNG</button>
                `;

                document.getElementById("ad-img").onchange = async (e) => {
                    if(e.target.files.length > 0) {

                        tempAdminImg = await resizeImage(e.target.files[0], 1200);
                        document.getElementById("ad-prev").innerHTML = `<img src="${tempAdminImg}" style="height:160px; border-radius:16px; border:3px solid var(--accent-mocha);">`;
                    }
                };

                document.getElementById("ad-save").onclick = async () => {
                    if(!tempAdminImg) return alert("Vui lòng tải ảnh lên!");
                    let rawTags = document.getElementById("ad-tags").value.split(',').map(t=>t.trim()).filter(t=>t);
                    
                    let finalData = {
                        name: document.getElementById("ad-name").value.trim(),

                        tags: rawTags,
                        hook: document.getElementById("ad-hook").value.trim(), 
                        link: document.getElementById("ad-link").value.trim()
                    };
                    
                    if(action === 'add') { finalData.id = "b_"+Date.now(); finalData.createdAt = Date.now(); finalData.feedbacks = []; finalData.isHidden = false; CONFIG.staff.push(finalData); }
                    else { Object.assign(CONFIG.staff.find(x => x.id === id), finalData); }
                    document.getElementById("ad-save").textContent = "Đang lưu..."; await saveConfig(); renderUI(); document.getElementById("admin-modal").classList.remove("show");
                };
            }
            else if (type === 'up') {
                let d = { name: "", idea: "", progressNote: "", progress: 10 };
                if (action === 'edit') { const b = CONFIG.upcomingBots.find(x => x.id === id); if(b) { d = b; tempAdminImg = b.avatar; } }
                
                body.innerHTML = `
                    <div class="admin-form-group"><label>Tên Dự Kiến</label><input type="text" id="ad-name" value="${d.name}"></div>
                    <label class="file-upload-label" style="width:100%; text-align:center;"><input type="file" accept="image/*" id="ad-img" style="display:none;"> 📸 TẢI ẢNH (VUÔNG)</label>
                    <div id="ad-prev" style="text-align:center; margin-bottom:20px;">${tempAdminImg ? `<img src="${tempAdminImg}" style="height:120px; border-radius:50%; border:4px solid var(--accent-mocha);">` : ''}</div>
                    
                    <div class="admin-form-group"><label>Ý Tưởng</label><textarea id="ad-idea" style="height:100px;">${d.idea}</textarea></div>
                    
                    <div style="display:flex; gap:20px; margin-bottom:15px;">
                        <div class="admin-form-group" style="flex:1;"><label>Tiến độ (%)</label><input type="number" id="ad-prog" value="${d.progress}" min="0" max="100"></div>
                        <div class="admin-form-group" style="flex:2;"><label>Ghi chú tiến độ</label><input type="text" id="ad-note" value="${d.progressNote}"></div>
                    </div>
                    
                    <button class="fb-btn-submit" id="ad-save">LƯU HỒ SƠ DỰ BỊ</button>
                `;

                document.getElementById("ad-img").onchange = async (e) => {
                    if(e.target.files.length > 0) { tempAdminImg = await resizeImage(e.target.files[0], 800); document.getElementById("ad-prev").innerHTML = `<img src="${tempAdminImg}" style="height:120px; border-radius:50%; border:4px solid var(--accent-mocha);">`; }
                };

                document.getElementById("ad-save").onclick = async () => {
                    if(!tempAdminImg) return alert("Nhớ úp ảnh cho bạn ấy nhé!");
                    let finalData = {
                        name: document.getElementById("ad-name").value.trim(), avatar: tempAdminImg,
                        idea: document.getElementById("ad-idea").value.trim(), progressNote: document.getElementById("ad-note").value, progress: parseInt(document.getElementById("ad-prog").value) || 0
                    };
                    if(action === 'add') { finalData.id = "u_"+Date.now(); finalData.votes = 0; finalData.isHidden = false; CONFIG.upcomingBots.push(finalData); }
                    else { Object.assign(CONFIG.upcomingBots.find(x => x.id === id), finalData); }
                    await saveConfig(); document.getElementById("admin-modal").classList.remove("show"); openUpcomingModal();
                };
            }
            
            document.getElementById("admin-modal").classList.add("show");
        };

        /* ============================================================
           BẢNG THÔNG BÁO (ADMIN ONLY) - THEO DÕI FEEDBACK
           ============================================================ */
        function checkNotifications() {
            if(!isAdminMode) return;
            let lastRead = parseInt(localStorage.getItem("capy_admin_read") || "0");
            let unreadCount = 0;
            CONFIG.staff.forEach(bot => {
                (bot.feedbacks||[]).forEach(fb => { 
                    if(fb.date > lastRead) unreadCount++; 
                    (fb.replies||[]).forEach(r => { if(r.date > lastRead) unreadCount++; });
                });
            });
            const badge = document.getElementById("noti-badge");
            if(unreadCount > 0) { badge.textContent = unreadCount > 9 ? "9+" : unreadCount; badge.style.display = "flex"; }
            else { badge.style.display = "none"; }
        }

        window.openNotiModal = function() {
            document.getElementById("modal-title").innerHTML = `<svg class="svg-icon" viewBox="0 0 16 16"><use href="#px-bell"></use></svg> BẢNG TIN CHUÔNG CHUỒNG CAPY`;
            let lastRead = parseInt(localStorage.getItem("capy_admin_read") || "0");
            let html = "";
            let allNotis = [];
            
            CONFIG.staff.forEach(bot => {
                (bot.feedbacks||[]).forEach(fb => {
                    allNotis.push({ type: 'fb', botId: bot.id, botName: bot.name, name: fb.name, date: fb.date, text: fb.text });
                    (fb.replies||[]).forEach(r => {
                        if(r.name.toLowerCase() !== 'chủ trọ') {
                            allNotis.push({ type: 'rep', botId: bot.id, botName: bot.name, name: r.name, fbName: fb.name, date: r.date, text: r.text });
                        }
                    });
                });
            });
            
            allNotis.sort((a,b) => b.date - a.date);

            if(allNotis.length === 0) { html = "<p style='color:var(--text-muted); text-align:center; font-weight:800; font-size:1.1rem;'>Chưa có hoạt động nào từ hành khách.</p>"; }
            else {
                html = allNotis.map(item => {
                    let isNew = item.date > lastRead ? `<span style="color:#FFF; background:#EF4444; font-weight:900; font-size:0.75rem; padding:4px 10px; border-radius:12px; margin-left:10px; box-shadow:0 2px 5px rgba(239,68,68,0.3);">MỚI TÍNH</span>` : "";
                    let contentTitle = item.type === 'fb' 
                        ? `Khách <b style="color:var(--accent-peach);">${item.name}</b> vừa review cho phòng <b style="color:var(--text-dark);">${item.botName}</b> ${isNew}`
                        : `Khách <b style="color:var(--accent-peach);">${item.name}</b> vừa rep lại bình luận của ${item.fbName} ở phòng <b style="color:var(--text-dark);">${item.botName}</b> ${isNew}`;
                    
                    return `
                    <div style="background:#FFF; padding:25px; border-radius:20px; border:3px dashed var(--accent-mocha); margin-bottom:20px; cursor:pointer; box-shadow:var(--shadow-soft); transition:0.3s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'" onclick="openFeedbackModal('${item.botId}')">
                        <div style="font-size:1.05rem; color:var(--text-dark); font-weight:800;">${contentTitle}</div>
                        <div style="font-size:1rem; color:var(--text-muted); margin-top:10px; font-style:italic; font-weight:700;">"${item.text.substring(0, 80)}..."</div>
                        <div style="font-size:0.85rem; color:#A0AEC0; margin-top:12px; font-weight:800;">${new Date(item.date).toLocaleString('vi-VN')}</div>
                    </div>`;
                }).join('');
            }
            
            document.getElementById("modal-body").innerHTML = html;
            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
            
            localStorage.setItem("capy_admin_read", Date.now());
            document.getElementById("noti-badge").style.display = "none";
        };

        /* ============================================================
           KHỞI CHẠY LÚC LOAD TRANG
           ============================================================ */
        document.addEventListener("DOMContentLoaded", () => {
            localforage.config({ name: 'CapyStationV1' });
            fetchConfig(); 
        });

    </script>
</body>
</html>
