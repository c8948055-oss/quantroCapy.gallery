<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Ga Meown - Reborn</title>
    
    <!-- Fonts: Playfair Display (Serif sang trọng) & Inter (Sans-serif hiện đại) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&display=swap" rel="stylesheet">
    
    <!-- Supabase & LocalForage -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        /* ============================================================
           BIẾN MÀU SẮC & FONT CHỮ (DARK CINEMATIC)
           ============================================================ */
        :root {
            --bg-deep: #0B112C; /* Xanh đêm thẫm */
            --bg-card: #0F0F14; /* Xám đen than củi */
            --bg-surface: #1A1F3A;
            --accent-cyan: #99F2F8; /* Xanh lơ nhạt */
            --accent-purple: #C4B5FD; /* Tím mờ */
            --accent-amber: #FDE68A; /* Vàng hổ phách nhạt */
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-deep);
            color: var(--text-main); 
            font-family: var(--font-body); 
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            background-image: radial-gradient(circle at 50% 0%, rgba(25, 30, 70, 0.6) 0%, transparent 70%);
        }
        button { cursor: pointer; border: none; background: none; font-family: inherit; outline: none;}
        input, select, textarea { font-family: inherit; outline: none; }
        img { max-width: 100%; display: block; }
        a { text-decoration: none; color: inherit; }
        .hidden { display: none !important; }

        /* ============================================================
           HEADER (TÊN GA & 2 NÚT TRUNG TÂM)
           ============================================================ */
        .header-section {
            max-width: 800px; margin: 80px auto 40px auto; text-align: center; padding: 0 20px;
        }
        .station-title {
            font-family: var(--font-heading); font-size: 3.5rem; font-weight: 900;
            background: linear-gradient(to right, #FFF, var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; cursor: pointer; letter-spacing: 2px;
        }
        .station-desc {
            font-size: 1rem; color: var(--text-muted); white-space: pre-wrap; margin-bottom: 30px; font-weight: 300;
        }
        .top-buttons {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }
        .btn-top {
            padding: 10px 24px; border-radius: 50px; font-weight: 600; font-size: 0.9rem;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); transition: 0.3s; backdrop-filter: blur(5px);
        }
        .btn-top:hover { background: rgba(255,255,255,0.1); border-color: var(--accent-purple); color: var(--accent-purple); }

        /* ============================================================
           BỘ LỌC (TAG ĐỘNG & TÌM KIẾM)
           ============================================================ */
        .filter-section {
            max-width: 1200px; margin: 0 auto 50px auto; padding: 0 20px;
            display: flex; flex-direction: column; align-items: center; gap: 25px;
        }
        .pill-tags-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 900px;
        }
        .pill-tag {
            padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 500;
            background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted);
            transition: 0.3s;
        }
        .pill-tag:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .pill-tag.active {
            background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .search-wrapper { width: 100%; max-width: 500px; position: relative; }
        .search-input {
            width: 100%; padding: 14px 24px; border-radius: 50px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(167, 139, 250, 0.2); }

        /* ============================================================
           GRID THẺ NHÂN VIÊN
           ============================================================ */
        .main-container { max-width: 1400px; margin: 0 auto 80px auto; padding: 0 20px; }
        .grid-header { display: flex; justify-content: flex-end; margin-bottom: 25px; }
        .sort-select {
            padding: 8px 16px; border-radius: 8px; background: var(--bg-surface); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); font-size: 0.85rem; font-weight: 500; cursor: pointer;
        }

        .bot-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;
        }

        /* THIẾT KẾ THẺ NHÂN VIÊN (DARK THEME) */
        .bot-card {
            background: var(--bg-card); border-radius: 16px; overflow: hidden; position: relative;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; height: 100%;
        }
        .bot-card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        
        .b-img-wrap { width: 100%; aspect-ratio: 9/16; position: relative; background: #000; overflow: hidden;}
        .b-img-wrap img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); transition: 0.4s; }
        .bot-card:hover .b-img-wrap img { filter: brightness(1.05); transform: scale(1.03); }

        .b-rating {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            color: var(--accent-amber); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            border: 1px solid rgba(253, 230, 138, 0.3); z-index: 2; display: flex; align-items: center; gap: 4px;
        }

        .b-info {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 20px 20px;
            background: linear-gradient(to top, rgba(15,15,20,1) 0%, rgba(15,15,20,0.95) 40%, rgba(15,15,20,0) 100%);
            display: flex; flex-direction: column; z-index: 2;
        }
        .b-name { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; color: #FFF; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); letter-spacing: 1px;}
        .b-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .b-tag { font-size: 0.65rem; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 4px; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.5px;}
        .b-hook { font-size: 0.85rem; color: var(--text-main); font-style: italic; margin-bottom: 20px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 5px #000;}
        
        .b-actions { display: flex; gap: 10px; }
        .b-btn { 
            flex: 1; padding: 12px 0; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-align: center; 
            letter-spacing: 0.5px; transition: 0.2s; text-transform: uppercase;
        }
        .b-btn-detail { background: var(--text-main); color: var(--bg-deep); }
        .b-btn-detail:hover { background: #FFF; box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .b-btn-fb { background: rgba(255,255,255,0.1); color: #FFF; border: 1px solid rgba(255,255,255,0.2); }
        .b-btn-fb:hover { background: rgba(255,255,255,0.2); border-color: #FFF; }

        /* ============================================================
           MODAL CHUNG & GÓC FEEDBACK
           ============================================================ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        
        .modal-content {
            background: var(--bg-surface); width: 100%; max-width: 800px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1); overflow: hidden; display: flex; flex-direction: column;
            max-height: 90vh; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .m-header {
            padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);
        }
        .m-title { font-family: var(--font-heading); font-size: 1.5rem; color: var(--accent-amber); margin: 0; }
        .m-close { font-size: 1.5rem; color: var(--text-muted); transition: 0.2s; }
        .m-close:hover { color: #EF4444; }
        .m-body { padding: 30px; overflow-y: auto; flex: 1; }
        .m-body::-webkit-scrollbar { width: 6px; }
        .m-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* CỤM FEEDBACK FORM */
        .fb-form { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; }
        .stars-select { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; font-size: 2rem; color: #334155; cursor: pointer; }
        .star-item.active { color: var(--accent-amber); text-shadow: 0 0 15px rgba(253, 230, 138, 0.5); }
        .fb-input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #FFF; margin-bottom: 15px; font-size: 0.9rem;}
        .fb-input:focus { border-color: var(--accent-cyan); }
        .fb-btn-submit { width: 100%; padding: 12px; background: var(--accent-purple); color: #000; font-weight: bold; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;}
        .fb-btn-submit:hover { background: #FFF; box-shadow: 0 0 15px rgba(196, 181, 253, 0.5); }
        .file-upload-label { display: inline-block; padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 8px; font-size: 0.8rem; color: var(--text-main); cursor: pointer; margin-bottom: 15px; transition: 0.2s;}
        .file-upload-label:hover { background: rgba(255,255,255,0.2); }
        .img-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;}
        .img-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }

        /* DANH SÁCH FEEDBACK */
        .fb-list { display: flex; flex-direction: column; gap: 20px; }
        .fb-item { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border-left: 3px solid var(--accent-cyan); position: relative;}
        .fb-item-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;}
        .fb-item-name { font-weight: 700; color: #FFF; font-size: 1.1rem; }
        .fb-item-stars { color: var(--accent-amber); font-size: 0.9rem; }
        .fb-item-text { color: var(--text-main); font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px;}
        .fb-item-imgs { display: flex; gap: 10px; flex-wrap: wrap; }
        .fb-item-imgs img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
        .fb-del-btn { background: #7F1D1D; color: #FFF; padding: 4px 10px; font-size: 0.7rem; border-radius: 4px; margin-top: 10px;}

        /* ============================================================
           ADMIN PANEL (THÔNG BÁO & CÔNG CỤ)
           ============================================================ */
        .admin-bar {
            position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; z-index: 9999;
            display: none; justify-content: space-between; align-items: center;
        }
        body.is-admin .admin-bar { display: flex; }
        .admin-controls { display: flex; gap: 10px; align-items: center;}
        .btn-ad { padding: 6px 12px; background: #334155; color: #FFF; border-radius: 6px; font-size: 0.8rem; font-weight: 600; transition: 0.2s;}
        .btn-ad:hover { background: var(--accent-cyan); color: #000; }
        .btn-ad.danger { background: transparent; border: 1px solid #EF4444; color: #EF4444; }
        .btn-ad.danger:hover { background: #EF4444; color: #FFF; }
        
        /* Nút Notification */
        .noti-btn { position: relative; cursor: pointer; color: var(--accent-amber); font-size: 1.2rem; margin-right: 15px;}
        .noti-badge { position: absolute; top: -5px; right: -8px; background: #EF4444; color: #FFF; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; font-weight: bold; }

        /* Khung Admin gắn trên thẻ */
        .card-admin-overlay { position: absolute; top: 10px; left: 10px; z-index: 10; display: none; gap: 5px; flex-direction: column;}
        body.is-admin .card-admin-overlay { display: flex; }
        .btn-card-ad { background: rgba(0,0,0,0.8); color: #FFF; border: 1px solid #FFF; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }
        .btn-card-ad:hover { background: #FFF; color: #000; }

        /* ============================================================
           THIẾT KẾ THẺ SẮP RA MẮT (UPCOMING BOTS)
           ============================================================ */
        .up-card {
            background: #111; border: 1px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
        }
        .up-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; filter: grayscale(1); margin-bottom: 15px; border: 2px solid #334155;}
        .up-name { font-family: var(--font-heading); font-size: 1.4rem; color: var(--accent-purple); margin-bottom: 10px;}
        .up-route { font-size: 0.75rem; color: #FFF; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; margin-bottom: 15px;}
        .up-idea { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;}
        
        .up-progress-wrap { width: 100%; margin-bottom: 20px; text-align: left; }
        .up-p-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-main); margin-bottom: 5px; font-weight:bold;}
        .up-p-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;}
        .up-p-fill { height: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); }
        .up-p-note { font-size: 0.75rem; color: var(--accent-amber); margin-top: 8px; font-style: italic;}
        
        .up-vote-btn { width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #FFF; font-weight: bold; transition: 0.2s;}
        .up-vote-btn.voted { border-color: #EF4444; color: #EF4444; }
        .up-vote-btn:hover { background: rgba(255,255,255,0.1); }

        /* Lightbox (Zoom ảnh) */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; justify-content: center; align-items: center; cursor: zoom-out;}
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

        @media (max-width: 600px) {
            .station-title { font-size: 2.2rem; }
            .bot-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .m-body { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- THANH ADMIN -->
    <div class="admin-bar">
        <div style="font-weight: 700; color: var(--accent-amber);">🛠 TRẠM ĐIỀU KHIỂN</div>
        <div class="admin-controls">
            <div class="noti-btn" onclick="openNotiModal()">🔔<span class="noti-badge" id="noti-badge" style="display:none;">0</span></div>

            <button class="btn-ad" onclick="openAdminForm('up', 'add')">+ Thêm Dự Bị</button>
            <button class="btn-ad danger" onclick="exitAdmin()">Thoát</button>

    <!-- HEADER: TÊN GA & 2 NÚT TRUNG TÂM -->
    <header class="header-section">
        <h1 class="station-title" id="trigger-admin" title="Nhấp đúp để vào Admin">Nhà Ga Meown</h1>
        <div class="station-desc" id="station-bio">Đang tải thông tin...</div>
        <div class="top-buttons">
            <button class="btn-top" onclick="openSMModal()">Thông tin trưởng ga</button>
            <button class="btn-top" onclick="openUpcomingModal()">Sắp ra mắt</button>
        </div>
    </header>

    <!-- BỘ LỌC & TÌM KIẾM -->
    <section class="filter-section">
        <div class="pill-tags-container" id="route-tags-container">
            <!-- Tags động -->
        </div>
        <div class="search-wrapper">
            <input type="text" id="search-inp" class="search-input" placeholder="🔍 Tìm nhân viên theo tên hoặc từ khóa...">

    </section>

    <!-- MAIN GRID -->
    <main class="main-container">
        <div class="grid-header">
            <select id="sort-select" class="sort-select">
                <option value="newest">Mới nhất</option>
                <option value="rating">Yêu thích nhất</option>
            </select>
        </div>
        <div class="bot-grid" id="bot-grid">
            <!-- Thẻ bài -->
        </div>
    </main>

    <!-- MODAL CHUNG (Hiển thị Thông tin trưởng ga, Trạm dự bị, Góc Feedback, Admin Forms...) -->
    <div class="modal-overlay" id="main-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="m-header">
                <h2 class="m-title" id="modal-title">Tiêu Đề</h2>
                <button class="m-close" onclick="closeModal(true)">✕</button>

            <div class="m-body" id="modal-body">

            </div>
        </div>
    </div>

    <!-- LIGHTBOX (Zoom ảnh) -->
    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <img src="" id="lightbox-img">
    </div>

    <script>
        /* ============================================================
           CƠ SỞ DỮ LIỆU & TRẠNG THÁI (MỚI TINH)
           ============================================================ */
        let CONFIG = {
            stationMaster: { bio: "Ở rìa của thực tại, nơi sương mù không bao giờ tan, có một nhà ga nhỏ mang tên Meown...", facebook: {name: "", url: ""} },
            staff: [], // {id, name, avatar, hook, tags, link, route, feedbacks: [{name, stars, text, imgs, date}], isHidden, createdAt}
            upcomingBots: [] // {id, name, avatar, idea, train, progress, note, votes, isHidden}
        };
        
        let isAdminMode = false;
        let activeRouteFilter = "all";
        let searchQuery = "";

        // Các tuyến cố định theo yêu cầu
        const ROUTES = ["Tuyến 09 (Hiện đại)", "Tuyến 03 (Cổ trang)", "Tuyến 07 (Dị giới)", "Tuyến 44 (Kinh dị)", "Tuyến 77 (Gameshow)"];

        // Kết nối Supabase
        const SUPABASE_URL = "https://gmejjxvahnqqrhihahid.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZWpqeHZhaG5xcXJoaWhhaGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTM5OTQsImV4cCI6MjA5OTMyOTk5NH0.Q1uit-9R_Lrs0uM_Azgbn9GGKMoyFl-cFfl3M7IeSMU";
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ============================================================
           TIỆN ÍCH CHUNG
           ============================================================ */
        function removeAccents(str) { return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() : ''; }
        function openLightbox(src, e) { e.stopPropagation(); document.getElementById("lightbox-img").src = src; document.getElementById("lightbox").style.display="flex"; }
        function closeModal(force = false) { 
            if(force || event.target.id === 'main-modal') {
                document.getElementById("main-modal").classList.remove("show"); 
                document.body.style.overflow = "auto";
            }
        }
        
        async function resizeImage(file, maxSize = 1200) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onload = (e) => { 
                    const img = new Image(); 
                    img.onload = () => { 
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height; 
                        if(w > maxSize || h > maxSize) { if(w > h) { h = Math.round((h * maxSize) / w); w = maxSize; } else { w = Math.round((w * maxSize) / h); h = maxSize; } } 
                        canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', 0.8)); 
                    }; img.src = e.target.result; 
                }; reader.readAsDataURL(file); 
            }); 
        }

        // Tính sao trung bình
        function getAvgRating(bot) {
            if(!bot.feedbacks || bot.feedbacks.length === 0) return 5.0; // Mặc định 5 sao nếu chưa ai chấm
            let sum = bot.feedbacks.reduce((acc, curr) => acc + curr.stars, 0);
            return (sum / bot.feedbacks.length).toFixed(1);
        }

        /* ============================================================
           ĐỒNG BỘ DỮ LIỆU
           ============================================================ */
        async function fetchConfig() {
            try {
                // Ép hệ thống dùng LocalForage làm nguồn duy nhất để "Tẩy trắng" theo yêu cầu "xóa hết" của bạn lúc trước.
                // Lưu ý: Tôi vẫn hook vào Supabase id=999 để tạo bảng database mới sạch sẽ, không đụng chạm data cũ bị kẹt.
                const { data } = await supa.from('station_config').select('data').eq('id', 999).single();
                if (data && data.data) {
                    CONFIG = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
                }
                
                // Đảm bảo cấu trúc mảng
                if(!Array.isArray(CONFIG.staff)) CONFIG.staff = [];
                if(!Array.isArray(CONFIG.upcomingBots)) CONFIG.upcomingBots = [];
                CONFIG.staff.forEach(s => { if(!Array.isArray(s.feedbacks)) s.feedbacks = []; });

                renderUI();
                checkNotifications();
            } catch(e) { console.error("Lỗi lấy dữ liệu:", e); renderUI(); }
        }

        async function saveConfig() {
            try {
                await supa.from('station_config').upsert([{ id: 999, data: JSON.stringify(CONFIG) }]);
            } catch(e) { console.error("Lỗi lưu DB:", e); }
        }

        /* ============================================================
           RENDER GIAO DIỆN CHÍNH
           ============================================================ */
        function renderUI() {
            document.getElementById("station-bio").innerHTML = CONFIG.stationMaster.bio;
            renderTags();
            renderGrid();
        }

        function renderTags() {
            const container = document.getElementById("route-tags-container");
            container.innerHTML = "";

            let activeRoutes = new Set();
            CONFIG.staff.forEach(b => { if(!b.isHidden || isAdminMode) activeRoutes.add(b.route); });

            const allBtn = document.createElement("button");
            allBtn.className = `pill-tag ${activeRouteFilter === 'all' ? 'active' : ''}`;
            allBtn.textContent = "Tất cả";
            allBtn.onclick = () => { activeRouteFilter = 'all'; renderUI(); };
            container.appendChild(allBtn);

            ROUTES.forEach(route => {
                if (activeRoutes.has(route) || isAdminMode) {
                    const btn = document.createElement("button");
                    const displayName = route.includes("(") ? route.split("(")[1].replace(")","").trim() : route;
                    btn.className = `pill-tag ${activeRouteFilter === route ? 'active' : ''}`;
                    btn.textContent = displayName;
                    btn.onclick = () => { activeRouteFilter = route; renderUI(); };
                    container.appendChild(btn);
                }
            });
        }

        function renderGrid() {
            const grid = document.getElementById("bot-grid");
            grid.innerHTML = "";
            const sortMode = document.getElementById("sort-select").value;
            const q = removeAccents(searchQuery);

            let displayBots = CONFIG.staff.filter(b => {
                if(b.isHidden && !isAdminMode) return false;
                if(activeRouteFilter !== 'all' && b.route !== activeRouteFilter) return false;
                if(q !== "") {
                    const matchName = removeAccents(b.name).includes(q);
                    const matchTags = (b.tags||[]).some(t => removeAccents(t).includes(q));
                    if(!matchName && !matchTags) return false;
                }
                return true;
            });

            displayBots.sort((a,b) => {
                if(sortMode === 'rating') return getAvgRating(b) - getAvgRating(a);
                return (b.createdAt || 0) - (a.createdAt || 0);
            });

            if(displayBots.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-muted); width:100%; text-align:center; padding: 40px;'>Chưa có hồ sơ nào ở khu vực này.</p>"; return;
            }

            displayBots.forEach(bot => {
                const card = document.createElement("div");
                card.className = "bot-card";
                
                let adminOver = isAdminMode ? `
                    <div class="card-admin-overlay">
                        <button class="btn-card-ad" onclick="openAdminForm('bot', 'edit', '${bot.id}'); event.stopPropagation();">Sửa</button>
                        <button class="btn-card-ad" onclick="toggleHideBot('${bot.id}', event)">${bot.isHidden ? 'Đang Ẩn' : 'Hiện'}</button>
                        <button class="btn-card-ad" style="color:#EF4444; border-color:#EF4444;" onclick="deleteBot('${bot.id}', event)">Xóa</button>
                    </div>
                ` : "";

                let tagsHtml = (bot.tags||[]).slice(0,3).map(t => `<span class="b-tag">${t.startsWith('#')?t:'#'+t}</span>`).join('');
                let rating = getAvgRating(bot);

                card.innerHTML = `
                    ${adminOver}
                    <div class="b-img-wrap"><img src="${bot.avatar || ''}" loading="lazy"><div class="b-rating">⭐ ${rating}</div></div>
                    <div class="b-info">
                        <div class="b-name">${bot.name}</div>
                        <div class="b-tags"><span class="b-tag" style="color:var(--accent-amber); border:1px solid var(--accent-amber);">${bot.route.split(' ')[0]}</span>${tagsHtml}</div>
                        <div class="b-hook">"${bot.hook || '...'}"</div>
                        <div class="b-actions">
                            <a href="${bot.link || '#'}" target="_blank" class="b-btn b-btn-detail" onclick="event.stopPropagation();">THÔNG TIN CHI TIẾT</a>
                            <button class="b-btn b-btn-fb" onclick="openFeedbackModal('${bot.id}'); event.stopPropagation();">GÓC FEEDBACK</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById("search-inp").addEventListener("input", e => { searchQuery = e.target.value.trim(); renderGrid(); });
        document.getElementById("sort-select").addEventListener("change", renderGrid);

        /* ============================================================
           MỞ MODAL: GÓC FEEDBACK (CHO TỪNG NHÂN VIÊN)
           ============================================================ */
        let tempFbImgs = [];
        let currentStars = 0;

        window.openFeedbackModal = function(botId) {
            const bot = CONFIG.staff.find(b => b.id === botId);
            if(!bot) return;
            tempFbImgs = []; currentStars = 0;
            
            document.getElementById("modal-title").textContent = `GÓC FEEDBACK: ${bot.name.toUpperCase()}`;
            const body = document.getElementById("modal-body");
            
            // Render Danh sách Feedbacks
            let fbListHtml = "";
            if(!bot.feedbacks || bot.feedbacks.length === 0) {
                fbListHtml = "<p style='color:var(--text-muted); font-style:italic;'>Chưa có đánh giá nào. Hãy là người đầu tiên!</p>";
            } else {
                // Sắp xếp feedback mới nhất lên đầu
                let sortedFb = [...bot.feedbacks].sort((a,b) => b.date - a.date);
                fbListHtml = sortedFb.map((fb, idx) => {
                    let imgsHtml = (fb.imgs||[]).map(src => `<img src="${src}" onclick="openLightbox(this.src, event)">`).join('');
                    let delBtn = isAdminMode ? `<button class="fb-del-btn" onclick="deleteFeedback('${botId}', ${idx})">Xóa</button>` : '';
                    return `
                        <div class="fb-item">
                            <div class="fb-item-header">
                                <span class="fb-item-name">${fb.name} <span class="fb-item-stars">${'★'.repeat(fb.stars)}${'☆'.repeat(5-fb.stars)}</span></span>
                                ${delBtn}
                            </div>
                            <div class="fb-item-text">${fb.text}</div>
                            <div class="fb-item-imgs">${imgsHtml}</div>
                        </div>
                    `;
                }).join('');
            }

            body.innerHTML = `
                <!-- Form Đánh Giá -->
                <div class="fb-form">
                    <div style="text-align:center; margin-bottom:10px; color:var(--text-muted); font-size:0.9rem;">Chấm điểm trải nghiệm của bạn</div>
                    <div class="stars-select" id="star-wrap">
                        <span class="star-item" data-val="1">☆</span><span class="star-item" data-val="2">☆</span>
                        <span class="star-item" data-val="3">☆</span><span class="star-item" data-val="4">☆</span><span class="star-item" data-val="5">☆</span>
                    </div>
                    <input type="text" id="fb-name" class="fb-input" placeholder="Tên của bạn (Tùy chọn, mặc định: Khách)...">
                    <textarea id="fb-text" class="fb-input" placeholder="Viết cảm nhận của bạn về nhân viên này..." style="height:100px;" required></textarea>
                    
                    <label class="file-upload-label"><input type="file" accept="image/*" multiple id="fb-file" style="display:none;"> 📎 Đính kèm ảnh (Tối đa 3 ảnh)</label>
                    <div class="img-preview" id="fb-preview"></div>
                    
                    <button class="fb-btn-submit" id="fb-submit-btn">GỬI FEEDBACK LÊN HỆ THỐNG</button>
                </div>
                <!-- Danh sách Đánh Giá -->
                <div style="font-family:var(--font-heading); font-size:1.2rem; color:var(--accent-cyan); margin-bottom:15px;">HÀNH KHÁCH NÓI GÌ?</div>
                <div class="fb-list" id="fb-list-wrap">${fbListHtml}</div>
            `;

            // Logic chọn Sao
            const starItems = body.querySelectorAll('.star-item');
            starItems.forEach(s => {
                s.onclick = () => {
                    currentStars = parseInt(s.dataset.val);
                    starItems.forEach(st => {
                        if(parseInt(st.dataset.val) <= currentStars) { st.textContent = '★'; st.classList.add('active'); }
                        else { st.textContent = '☆'; st.classList.remove('active'); }
                    });
                };
            });

            // Logic tải ảnh
            document.getElementById("fb-file").onchange = async (e) => {
                const prev = document.getElementById("fb-preview");
                if(e.target.files.length + tempFbImgs.length > 3) return alert("Chỉ được gửi tối đa 3 ảnh!");
                prev.innerHTML = "<span style='color:var(--accent-amber); font-size:12px;'>Đang xử lý ảnh...</span>";
                for(let f of e.target.files) { tempFbImgs.push(await resizeImage(f, 1000)); }
                prev.innerHTML = tempFbImgs.map((src, i) => `<div style="position:relative;"><img src="${src}"><button style="position:absolute;top:-5px;right:-5px;background:red;color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;" onclick="removeFbImg(${i}, '${botId}')">✕</button></div>`).join('');
            };

            // Logic Submit
            document.getElementById("fb-submit-btn").onclick = async () => {
                if(currentStars === 0) return alert("Vui lòng chấm điểm (Sao) cho nhân viên!");
                const text = document.getElementById("fb-text").value.trim();
                if(!text) return alert("Vui lòng viết vài dòng cảm nhận!");
                
                const name = document.getElementById("fb-name").value.trim() || "Lữ Khách";
                
                bot.feedbacks.push({ name: name, stars: currentStars, text: text, imgs: [...tempFbImgs], date: Date.now() });
                
                document.getElementById("fb-submit-btn").textContent = "ĐANG GỬI...";
                await saveConfig();
                renderUI(); // Render lại lưới để cập nhật sao TB ngoài thẻ
                openFeedbackModal(botId); // Reload lại modal feedback
            };

            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.removeFbImg = function(idx, botId) { tempFbImgs.splice(idx, 1); const prev = document.getElementById("fb-preview"); prev.innerHTML = tempFbImgs.map((src, i) => `<div style="position:relative;"><img src="${src}"><button style="position:absolute;top:-5px;right:-5px;background:red;color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;" onclick="removeFbImg(${i}, '${botId}')">✕</button></div>`).join(''); }

        window.deleteFeedback = async function(botId, fbIndex) {
            if(!confirm("Xóa feedback này?")) return;
            const bot = CONFIG.staff.find(b => b.id === botId);
            // Do mảng render bị reverse, ta cần tìm index thực tế
            let sortedFb = [...bot.feedbacks].sort((a,b) => b.date - a.date);
            let realTarget = sortedFb[fbIndex];
            let realIndex = bot.feedbacks.findIndex(f => f.date === realTarget.date);
            
            if(realIndex > -1) {
                bot.feedbacks.splice(realIndex, 1);
                await saveConfig();
                renderUI(); openFeedbackModal(botId);
            }
        };

        /* ============================================================
           MỞ MODAL: SẮP RA MẮT & TRƯỞNG GA
           ============================================================ */
        window.openSMModal = function() {
            document.getElementById("modal-title").textContent = "THÔNG TIN TRƯỞNG GA";
            let fbHtml = CONFIG.stationMaster.facebook.url ? `<div style="margin-top:30px; text-align:center;"><a href="${CONFIG.stationMaster.facebook.url}" target="_blank" style="display:inline-block; padding:10px 20px; background:var(--accent-purple); color:#000; font-weight:bold; border-radius:50px;">Liên hệ Facebook: ${CONFIG.stationMaster.facebook.name}</a></div>` : '';
            document.getElementById("modal-body").innerHTML = `<div style="white-space:pre-wrap; line-height:1.8; color:var(--text-main); font-size:1.05rem;">${CONFIG.stationMaster.bio}</div>${fbHtml}`;
            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.openUpcomingModal = function() {
            document.getElementById("modal-title").textContent = "SẢNH TUYỂN DỤNG (SẮP RA MẮT)";
            const body = document.getElementById("modal-body");
            
            let displayBots = CONFIG.upcomingBots.filter(b => !b.isHidden || isAdminMode);
            displayBots.sort((a,b) => (b.progress - a.progress) || (b.votes - a.votes));

            if(displayBots.length === 0) {
                body.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding:40px;'>Sảnh tuyển dụng hiện đang im lìm...</p>";
            } else {
                let html = `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">`;
                displayBots.forEach(bot => {
                    let adminOver = isAdminMode ? `<div class="card-admin-overlay"><button class="btn-card-ad" onclick="openAdminForm('up', 'edit', '${bot.id}')">Sửa</button><button class="btn-card-ad" onclick="toggleHideUp('${bot.id}')">${bot.isHidden?'Đang Ẩn':'Hiện'}</button><button class="btn-card-ad" style="color:#EF4444; border-color:#EF4444;" onclick="deleteUp('${bot.id}')">Xóa</button></div>` : '';
                    let hasVoted = localStorage.getItem('vote_' + bot.id) === 'true';
                    
                    html += `
                        <div class="up-card">
                            ${adminOver}
                            <img src="${bot.avatar}" class="up-avatar">
                            <div class="up-name">${bot.name}</div>
                            <div class="up-route">${bot.train}</div>
                            <div class="up-idea">"${bot.idea}"</div>
                            <div class="up-progress-wrap">
                                <div class="up-p-header"><span>Tiến độ:</span><span>${bot.progress}%</span></div>
                                <div class="up-p-bar"><div class="up-p-fill" style="width:${bot.progress}%"></div></div>
                                ${bot.progressNote ? `<div class="up-p-note">➤ ${bot.progressNote}</div>` : ''}
                            </div>
                            <button class="up-vote-btn ${hasVoted?'voted':''}" onclick="voteUp('${bot.id}')">
                                ${hasVoted ? '❤️ Đã thả tim' : '🤍 Hóng'} (${bot.votes || 0})
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
                body.innerHTML = html;
            }

            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        window.voteUp = async function(id) {
            if(localStorage.getItem('vote_' + id) === 'true') return;
            let bot = CONFIG.upcomingBots.find(b => b.id === id);
            if(bot) {
                bot.votes = (bot.votes || 0) + 1;
                localStorage.setItem('vote_' + id, 'true');
                await saveConfig(); openUpcomingModal();
            }
        };

        /* ============================================================
           QUẢN LÝ ADMIN
           ============================================================ */
        document.getElementById("trigger-admin").addEventListener("dblclick", () => {
            if(!isAdminMode) { if(prompt("Mật mã Trưởng Ga:") === "bhnt2006") { isAdminMode = true; document.body.classList.add("is-admin"); renderUI(); checkNotifications(); } }
        });
        function exitAdmin() { isAdminMode = false; document.body.classList.remove("is-admin"); renderUI(); document.getElementById("noti-badge").style.display="none"; }

        window.toggleHideBot = async function(id, e) { e.stopPropagation(); let b = CONFIG.staff.find(x => x.id === id); if(b) { b.isHidden = !b.isHidden; await saveConfig(); renderUI(); } };
        window.deleteBot = async function(id, e) { e.stopPropagation(); if(confirm("Xóa thẻ này?")) { CONFIG.staff = CONFIG.staff.filter(x => x.id !== id); await saveConfig(); renderUI(); } };
        window.toggleHideUp = async function(id) { let b = CONFIG.upcomingBots.find(x => x.id === id); if(b) { b.isHidden = !b.isHidden; await saveConfig(); openUpcomingModal(); } };
        window.deleteUp = async function(id) { if(confirm("Xóa thẻ dự bị này?")) { CONFIG.upcomingBots = CONFIG.upcomingBots.filter(x => x.id !== id); await saveConfig(); openUpcomingModal(); } };

                    <label style="display:block; margin-bottom:5px; color:var(--accent-cyan);">Tên hiển thị FB</label>
                    <input type="text" id="ad-fbname" value="${CONFIG.stationMaster.facebook.name}" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); color:#fff; border-radius:8px; border:1px solid rgba(255,255,255,0.2); margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; color:var(--accent-cyan);">Link FB</label>
                    <input type="text" id="ad-fburl" value="${CONFIG.stationMaster.facebook.url}" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); color:#fff; border-radius:8px; border:1px solid rgba(255,255,255,0.2); margin-bottom:20px;">
                    <button class="fb-btn-submit" id="ad-save">LƯU THÔNG TIN</button>
                `;
                document.getElementById("ad-save").onclick = async () => {
                    CONFIG.stationMaster.bio = document.getElementById("ad-bio").value;
                    CONFIG.stationMaster.facebook = { name: document.getElementById("ad-fbname").value, url: document.getElementById("ad-fburl").value };
                    await saveConfig(); renderUI(); closeModal(true);

            }
            else if (type === 'bot') {
                let d = { name: "", route: ROUTES[0], hook: "", link: "", tags: [] };
                if (action === 'edit') { const b = CONFIG.staff.find(x => x.id === id); if(b) { d = b; tempAdminImg = b.avatar; } }
                
                let routeOpts = ROUTES.map(r => `<option value="${r}" ${d.route === r ? 'selected' : ''} style="color:#000;">${r}</option>`).join('');

                        <div style="flex:1;"><label style="display:block; color:var(--accent-cyan);">Tuyến Tuyển Dụng</label><select id="ad-route" class="fb-input">${routeOpts}</select></div>
                    </div>
                    <label class="file-upload-label" style="width:100%; text-align:center;"><input type="file" accept="image/*" id="ad-img" style="display:none;"> 📸 TẢI ẢNH (CHÂN DUNG DỌC)</label>
                    <div id="ad-prev" style="text-align:center; margin-bottom:15px;">${tempAdminImg ? `<img src="${tempAdminImg}" style="height:100px; border-radius:8px;">` : ''}</div>

                    <label style="display:block; color:var(--accent-amber);">Link Web Chi Tiết (URL Docs/Notion...)</label><input type="text" id="ad-link" value="${d.link || ''}" class="fb-input" placeholder="https://...">
                    
                    <button class="fb-btn-submit" id="ad-save">LƯU NHÂN VIÊN</button>

                document.getElementById("ad-img").onchange = async (e) => {
                    if(e.target.files.length > 0) {
                        document.getElementById("ad-prev").innerHTML = "<span style='color:var(--accent-amber);'>Đang nén ảnh...</span>";
                        tempAdminImg = await resizeImage(e.target.files[0], 1200);

                        hook: document.getElementById("ad-hook").value.trim(), link: document.getElementById("ad-link").value.trim()
                    };
                    if(action === 'add') { finalData.id = "b_"+Date.now(); finalData.createdAt = Date.now(); finalData.feedbacks = []; finalData.isHidden = false; CONFIG.staff.push(finalData); }

                    document.getElementById("ad-save").textContent = "Đang lưu..."; await saveConfig(); renderUI(); closeModal(true);
                };
            }
            else if (type === 'up') {
                let d = { name: "", train: ROUTES[0], idea: "", progressNote: "", progress: 10 };
                if (action === 'edit') { const b = CONFIG.upcomingBots.find(x => x.id === id); if(b) { d = b; tempAdminImg = b.avatar; } }
                
                body.innerHTML = `
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <div style="flex:1;"><label style="display:block; color:var(--accent-cyan);">Tên Bot Dự Kiến</label><input type="text" id="ad-name" value="${d.name}" class="fb-input"></div>
                        <div style="flex:1;"><label style="display:block; color:var(--accent-cyan);">Chuyến Tàu</label><input type="text" id="ad-route" value="${d.train}" class="fb-input"></div>
                    </div>
                    <label class="file-upload-label" style="width:100%; text-align:center;"><input type="file" accept="image/*" id="ad-img" style="display:none;"> 📸 TẢI ẢNH (VUÔNG)</label>
                    <div id="ad-prev" style="text-align:center; margin-bottom:15px;">${tempAdminImg ? `<img src="${tempAdminImg}" style="height:100px; border-radius:50%;">` : ''}</div>
                    
                    <label style="display:block; color:var(--accent-cyan);">Ý Tưởng / Giới thiệu</label><textarea id="ad-idea" class="fb-input" style="height:80px;">${d.idea}</textarea>
                    
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <div style="flex:1;"><label style="display:block; color:var(--accent-amber);">Tiến độ (%)</label><input type="number" id="ad-prog" value="${d.progress}" min="0" max="100" class="fb-input"></div>
                        <div style="flex:2;"><label style="display:block; color:var(--accent-amber);">Ghi chú tiến độ</label><input type="text" id="ad-note" value="${d.progressNote}" class="fb-input" placeholder="VD: Đang sửa prompt..."></div>
                    </div>
                    
                    <button class="fb-btn-submit" id="ad-save">LƯU HỒ SƠ DỰ BỊ</button>
                `;

                document.getElementById("ad-img").onchange = async (e) => {
                    if(e.target.files.length > 0) { tempAdminImg = await resizeImage(e.target.files[0], 800); document.getElementById("ad-prev").innerHTML = `<img src="${tempAdminImg}" style="height:100px; border-radius:50%;">`; }
                };

                document.getElementById("ad-save").onclick = async () => {
                    let finalData = {
                        name: document.getElementById("ad-name").value.trim(), train: document.getElementById("ad-route").value, avatar: tempAdminImg,
                        idea: document.getElementById("ad-idea").value.trim(), progressNote: document.getElementById("ad-note").value, progress: parseInt(document.getElementById("ad-prog").value) || 0
                    };
                    if(action === 'add') { finalData.id = "u_"+Date.now(); finalData.votes = 0; finalData.isHidden = false; CONFIG.upcomingBots.push(finalData); }
                    else { Object.assign(CONFIG.upcomingBots.find(x => x.id === id), finalData); }
                    await saveConfig(); closeModal(true); openUpcomingModal();
                };
            }
            
            document.getElementById("main-modal").classList.add("show");
            document.body.style.overflow = "hidden";
        };

        /* ============================================================
           BẢNG THÔNG BÁO (ADMIN ONLY)
           ============================================================ */
        function checkNotifications() {
            if(!isAdminMode) return;
            let lastRead = parseInt(localStorage.getItem("meown_admin_read") || "0");
            let unreadCount = 0;
            CONFIG.staff.forEach(bot => {
                (bot.feedbacks||[]).forEach(fb => { if(fb.date > lastRead) unreadCount++; });
            });
            const badge = document.getElementById("noti-badge");
            if(unreadCount > 0) { badge.textContent = unreadCount; badge.style.display = "block"; }
            else { badge.style.display = "none"; }
        }

        window.openNotiModal = function() {
            document.getElementById("modal-title").textContent = "BẢNG THÔNG BÁO FEEDBACK";
            let lastRead = parseInt(localStorage.getItem("meown_admin_read") || "0");
            let html = "";
            let allFbs = [];
            
            CONFIG.staff.forEach(bot => {
                (bot.feedbacks||[]).forEach(fb => {
                    allFbs.push({ botId: bot.id, botName: bot.name, fbName: fb.name, date: fb.date, text: fb.text });
                });
            });
            
            allFbs.sort((a,b) => b.date - a.date); // Mới nhất lên đầu

            if(allFbs.length === 0) { html = "<p style='color:var(--text-muted); text-align:center;'>Chưa có ai gửi feedback.</p>"; }
            else {
                html = allFbs.map(item => {
                    let isNew = item.date > lastRead ? `<span style="color:#EF4444; font-weight:bold; font-size:0.7rem; border:1px solid #EF4444; padding:2px 6px; border-radius:10px; margin-left:10px;">MỚI</span>` : "";
                    return `
                    <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:8px; border-left:3px solid var(--accent-amber); margin-bottom:15px; cursor:pointer;" onclick="openFeedbackModal('${item.botId}')">
                        <div style="font-size:0.95rem; color:#FFF;">Khách hàng <b style="color:var(--accent-cyan);">${item.fbName}</b> vừa bình luận về <b style="color:var(--accent-purple);">${item.botName}</b> ${isNew}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:5px; font-style:italic;">"${item.text.substring(0, 50)}..."</div>
                        <div style="font-size:0.7rem; color:#666; margin-top:5px;">${new Date(item.date).toLocaleString('vi-VN')}</div>
                    </div>`;
                }).join('');
            }
            
            document.getElementById("modal-body").innerHTML = html;
            document.getElementById("main-modal").classList.add("show");
            
            // Đánh dấu đã đọc
            localStorage.setItem("meown_admin_read", Date.now());
            document.getElementById("noti-badge").style.display = "none";
        };

        /* Chạy lần đầu */
        document.addEventListener("DOMContentLoaded", () => {
            localforage.config({ name: 'MeownV3' });
            fetchConfig();
        });

    </script>
</body>
</html>
