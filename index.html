    <script>
        /* --- KHỞI TẠO DỮ LIỆU --- */
        let CONFIG = { stationMaster: { bio: "Ở rìa của thực tại, nơi sương mù không bao giờ tan..." }, staff: [] };
        let isAdminMode = false;
        let activeRouteFilter = "all";
        let searchQuery = "";

        // Danh sách Tuyến Cố Định
        const ROUTES = [
            "Tuyến 09 (Hiện đại)",
            "Tuyến 03 (Cổ trang)",
            "Tuyến 07 (Dị giới)",
            "Tuyến 44 (Kinh dị)",
            "Tuyến 77 (Gameshow)"
        ];

        /* --- SUPABASE SETUP --- */
        const SUPABASE_URL = "https://gmejjxvahnqqrhihahid.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZWpqeHZhaG5xcXJoaWhhaGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTM5OTQsImV4cCI6MjA5OTMyOTk5NH0.Q1uit-9R_Lrs0uM_Azgbn9GGKMoyFl-cFfl3M7IeSMU";
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* --- TIỆN ÍCH CHUNG --- */
        function removeAccents(str) { 
            return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() : ''; 
        }

        function resizeImage(file, maxSize = 1200) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onload = (e) => { 
                    const img = new Image(); 
                    img.onload = () => { 
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height; 
                        if(w > maxSize || h > maxSize) { if(w > h) { h = Math.round((h * maxSize) / w); w = maxSize; } else { w = Math.round((w * maxSize) / h); h = maxSize; } } 
                        canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', 0.85)); 
                    }; 
                    img.src = e.target.result; 
                }; 
                reader.readAsDataURL(file); 
            }); 
        }

        /* --- ĐỒNG BỘ DỮ LIỆU --- */
        async function fetchConfig() {
            try {
                const { data } = await supa.from('station_config').select('data').eq('id', 1).single();
                if (data && data.data) {
                    let parsed = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
                    CONFIG = { ...CONFIG, ...parsed };
                } else {
                    // Backup từ localforage nếu cloud lỗi
                    let localBackup = await localforage.getItem("meown_config_backup");
                    if (localBackup) CONFIG = { ...CONFIG, ...localBackup };
                }

                // Tiền xử lý dữ liệu cũ để tương thích giao diện mới
                if (!Array.isArray(CONFIG.staff)) CONFIG.staff = [];
                CONFIG.staff.forEach(bot => {
                    // Nếu bot chưa có field rating do đổi logic, tạo mới
                    if (typeof bot.staticRating !== 'number') {
                        // Tính từ đánh giá cũ nếu có
                        if (bot.rating && bot.rating.count > 0) {
                            bot.staticRating = parseFloat((bot.rating.sum / bot.rating.count).toFixed(1));
                        } else {
                            bot.staticRating = 5.0; // Mặc định 5 sao
                        }
                    }
                    // Nếu bot chưa gán tuyến, gán tạm tuyến đầu tiên để không bị ẩn
                    if (!bot.route) bot.route = ROUTES[0]; 
                });

                renderUI();
            } catch (e) {
                console.error("Lỗi tải dữ liệu", e);
            }
        }

        async function saveConfig() {
            try {
                await localforage.setItem("meown_config_backup", CONFIG);
                await supa.from('station_config').upsert([{ id: 1, data: JSON.stringify(CONFIG) }]);
            } catch(e) { console.error("Lỗi lưu", e); }
        }

        /* --- RENDER GIAO DIỆN --- */
        function renderUI() {
            // 1. Render Giới thiệu
            document.getElementById("station-bio").innerHTML = CONFIG.stationMaster.bio || "Chào mừng đến với nhà ga Meown.";

            // 2. Render Thanh Lọc Tag Động
            const tagsContainer = document.getElementById("route-tags-container");
            tagsContainer.innerHTML = "";
            
            // Tìm các tuyến đang có bot thực sự (không bị ẩn nếu không phải admin)
            let activeRoutes = new Set();
            CONFIG.staff.forEach(bot => {
                if (!bot.isHidden || isAdminMode) {
                    if (bot.route) activeRoutes.add(bot.route);
                }
            });

            // Tag "Tất cả"
            const allBtn = document.createElement("button");
            allBtn.className = `pill-tag ${activeRouteFilter === 'all' ? 'active' : ''}`;
            allBtn.textContent = "Tất cả tuyến";
            allBtn.onclick = () => { activeRouteFilter = 'all'; renderGrid(); renderUI(); };
            tagsContainer.appendChild(allBtn);

            // Render các tag có dữ liệu
            ROUTES.forEach(route => {
                if (activeRoutes.has(route)) {
                    const btn = document.createElement("button");
                    // Rút gọn tên tuyến để hiển thị đẹp (VD: "Tuyến 09 (Hiện đại)" -> "Hiện đại")
                    const displayName = route.includes("(") ? route.split("(")[1].replace(")","").trim() : route;
                    btn.className = `pill-tag ${activeRouteFilter === route ? 'active' : ''}`;
                    btn.textContent = displayName;
                    btn.onclick = () => { activeRouteFilter = route; renderGrid(); renderUI(); };
                    tagsContainer.appendChild(btn);
                }
            });

            // 3. Render Grid Thẻ
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById("bot-grid");
            grid.innerHTML = "";
            
            const sortMode = document.getElementById("sort-select").value;
            const q = removeAccents(searchQuery);

            let displayBots = CONFIG.staff.filter(bot => {
                // Lọc ẩn/hiện
                if (bot.isHidden && !isAdminMode) return false;
                // Lọc theo tag tuyến
                if (activeRouteFilter !== 'all' && bot.route !== activeRouteFilter) return false;
                // Lọc theo thanh tìm kiếm (Tên hoặc Tags)
                if (q !== "") {
                    const matchName = removeAccents(bot.name).includes(q);
                    const matchTags = (bot.tags || []).some(t => removeAccents(t).includes(q));
                    if (!matchName && !matchTags) return false;
                }
                return true;
            });

            // Sắp xếp
            displayBots.sort((a, b) => {
                if (sortMode === 'rating') {
                    return (b.staticRating || 0) - (a.staticRating || 0);
                } else {
                    return (b.createdAt || 0) - (a.createdAt || 0);
                }
            });

            if (displayBots.length === 0) {
                grid.innerHTML = "<p style='color:var(--text-light); width:100%; text-align:center; padding: 40px;'>Không tìm thấy hồ sơ phù hợp.</p>";
                return;
            }

            displayBots.forEach(bot => {
                const card = document.createElement("div");
                card.className = "bot-card";
                
                // Khối Admin trên thẻ
                let adminOver = isAdminMode ? `
                    <div class="card-admin-overlay">
                        <button class="admin-btn" onclick="openAdminModal('bot', 'edit', '${bot.id}'); event.stopPropagation();">Sửa</button>
                        <button class="admin-btn ${bot.isHidden ? 'danger' : ''}" onclick="toggleBotHide('${bot.id}', event)">${bot.isHidden ? 'Đang Ẩn' : 'Hiện'}</button>
                        <button class="admin-btn danger" onclick="deleteBot('${bot.id}', event)">Xóa</button>
                    </div>
                ` : "";

                // Tags HTML
                let tagsHtml = (bot.tags || []).slice(0,3).map(t => `<span class="bot-mini-tag">${t.startsWith('#')?t:'#'+t}</span>`).join('');
                
                card.innerHTML = `
                    ${adminOver}
                    <div class="bot-image-wrap">
                        <img src="${bot.avatar || ''}" loading="lazy" alt="${bot.name}">
                        <div class="bot-rating-badge">⭐ ${(bot.staticRating || 5.0).toFixed(1)}</div>
                    </div>
                    <div class="bot-info-area">
                        <div class="bot-name">${bot.name}</div>
                        <div class="bot-mini-tags">${tagsHtml}</div>
                        <div class="bot-hook">"${bot.hook || '...'}"</div>
                        <button class="bot-action-btn">THÔNG TIN CHI TIẾT</button>
                    </div>
                `;
                
                // Click toàn bộ thẻ mở Modal Detail
                card.addEventListener("click", () => openDetailModal(bot.id));
                grid.appendChild(card);
            });
        }

        /* --- XỬ LÝ SỰ KIỆN SEARCH & SORT --- */
        document.getElementById("search-inp").addEventListener("input", (e) => {
            searchQuery = e.target.value.trim();
            renderGrid();
        });
        document.getElementById("sort-select").addEventListener("change", () => {
            renderGrid();
        });


        /* --- MODAL CHI TIẾT --- */
        function openDetailModal(botId) {
            const bot = CONFIG.staff.find(b => b.id === botId);
            if(!bot) return;

            document.getElementById("dm-avatar").src = bot.avatar || "";
            document.getElementById("dm-name").textContent = bot.name;
            
            // Xếp tag: Route trước, Tags sau
            let allTagsHtml = `<span class="dm-tag" style="border-color: var(--accent); color: var(--accent);">${bot.route}</span>`;
            allTagsHtml += (bot.tags || []).map(t => `<span class="dm-tag">${t.startsWith('#')?t:'#'+t}</span>`).join('');
            document.getElementById("dm-tags").innerHTML = allTagsHtml;

            // Scenario (Rich text)
            document.getElementById("dm-scenario").innerHTML = bot.scenario || "<p style='text-align:center; font-style:italic;'>Chưa có thông tin chi tiết.</p>";

            // Link chat
            const chatBtn = document.getElementById("dm-chat-link");
            if (bot.chatLink) {
                chatBtn.href = bot.chatLink;
                chatBtn.style.display = "inline-block";
            } else {
                chatBtn.style.display = "none";
            }

            document.getElementById("detail-modal").classList.add("show");
            document.body.style.overflow = "hidden"; // Khóa cuộn trang nền
        }

        function closeDetailModal(e) {
            if(e) {
                // Chỉ đóng nếu click vào nền ngoài hoặc nút X
                if (e.target.classList.contains('detail-modal-overlay') || e.target.classList.contains('dm-close')) {
                    document.getElementById("detail-modal").classList.remove("show");
                    document.body.style.overflow = "auto";
                }
            } else {
                document.getElementById("detail-modal").classList.remove("show");
                document.body.style.overflow = "auto";
            }
        }


        /* --- QUẢN LÝ ADMIN --- */
        // Xác thực Admin bằng Double Click
        document.getElementById("trigger-admin").addEventListener("dblclick", () => {
            if(!isAdminMode) {
                if(prompt("Mật mã Trưởng Ga:") === "bhnt2006") {
                    isAdminMode = true;
                    document.body.classList.add("is-admin");
                    renderUI();
                }
            }
        });
        function exitAdmin() {
            isAdminMode = false;
            document.body.classList.remove("is-admin");
            renderUI();
        }

        // --- CÁC HÀM XÓA/ẨN CHO ADMIN ---
        window.toggleBotHide = async function(botId, e) {
            e.stopPropagation();
            let b = CONFIG.staff.find(x => x.id === botId);
            if(b) {
                b.isHidden = !b.isHidden;
                await saveConfig();
                renderUI();
            }
        };
        window.deleteBot = async function(botId, e) {
            e.stopPropagation();
            if(confirm("Xóa vĩnh viễn nhân viên này?")) {
                CONFIG.staff = CONFIG.staff.filter(x => x.id !== botId);
                await saveConfig();
                renderUI();
            }
        };

        // Biến tạm lưu ảnh
        let tempAvatarB64 = "";

        window.openAdminModal = function(type, action, id) {
            const modal = document.getElementById("admin-modal");
            const title = document.getElementById("admin-form-title");
            const body = document.getElementById("admin-form-body");
            tempAvatarB64 = "";

            if (type === 'sm') {
                title.textContent = "SỬA GIỚI THIỆU NHÀ GA";
                body.innerHTML = `
                    <div class="admin-form-group">
                        <label>Đoạn văn giới thiệu (Hỗ trợ HTML cơ bản `<br>` để xuống dòng)</label>
                        <textarea id="ad-bio" style="height: 150px;">${CONFIG.stationMaster.bio || ''}</textarea>
                    </div>
                    <button class="admin-btn" id="ad-save-sm" style="width:100%; padding:15px; font-size:1rem;">LƯU LẠI</button>
                `;
                document.getElementById("ad-save-sm").onclick = async () => {
                    CONFIG.stationMaster.bio = document.getElementById("ad-bio").value;
                    await saveConfig();
                    renderUI();
                    modal.classList.remove("show");
                };
            }
            else if (type === 'bot') {
                let botData = { name: "", avatar: "", hook: "", tags: [], scenario: "", chatLink: "", route: ROUTES[0], staticRating: 5.0, isHidden: false };
                if (action === 'edit') {
                    const b = CONFIG.staff.find(x => x.id === id);
                    if (b) { botData = b; tempAvatarB64 = b.avatar || ""; }
                }

                let routeOptions = ROUTES.map(r => `<option value="${r}" ${botData.route === r ? 'selected' : ''}>${r}</option>`).join('');

                title.textContent = action === 'add' ? "THÊM NHÂN VIÊN MỚI" : "SỬA NHÂN VIÊN";
                body.innerHTML = `
                    <div style="display:flex; gap: 15px;">
                        <div class="admin-form-group" style="flex:1;">
                            <label>Tên nhân viên</label>
                            <input type="text" id="ad-b-name" value="${botData.name}">
                        </div>
                        <div class="admin-form-group" style="width:150px;">
                            <label>Đánh giá (⭐)</label>
                            <input type="number" step="0.1" min="1" max="5" id="ad-b-rating" value="${botData.staticRating}">
                        </div>
                    </div>
                    
                    <div style="display:flex; gap: 15px;">
                        <div class="admin-form-group" style="flex:1;">
                            <label>Tuyến (Phân loại)</label>
                            <select id="ad-b-route">${routeOptions}</select>
                        </div>
                        <div class="admin-form-group" style="flex:1;">
                            <label>Tải ảnh dọc (9:16)</label>
                            <input type="file" accept="image/*" id="ad-b-file">
                        </div>
                    </div>
                    <div id="ad-b-prev" style="margin-bottom:15px;">
                        ${tempAvatarB64 ? `<img src="${tempAvatarB64}" style="height:100px; border-radius:8px;">` : ''}
                    </div>

                    <div class="admin-form-group">
                        <label>Tags (Cách nhau dấu phẩy, VD: Cổ trang, Chiếm hữu)</label>
                        <input type="text" id="ad-b-tags" value="${(botData.tags || []).join(', ')}">
                    </div>
                    <div class="admin-form-group">
                        <label>Đoạn thoại đặc trưng (Hook - Ngắn gọn)</label>
                        <input type="text" id="ad-b-hook" value="${botData.hook || ''}">
                    </div>
                    <div class="admin-form-group">
                        <label>Nội dung chi tiết (Hiển thị khi bấm vào thẻ)</label>
                        <!-- Thanh công cụ Rich Text Đơn giản -->
                        <div class="rt-toolbar">
                            <button type="button" onclick="document.execCommand('bold',false,null)"><b>B</b></button>
                            <button type="button" onclick="document.execCommand('italic',false,null)"><i>I</i></button>
                            <button type="button" onclick="document.execCommand('underline',false,null)"><u>U</u></button>
                            <button type="button" onclick="document.execCommand('insertUnorderedList',false,null)">Bullet List</button>
                            <button type="button" onclick="document.execCommand('formatBlock', false, 'H3')">Tiêu Đề (H3)</button>
                            <button type="button" onclick="insertLineBreakAdmin()">↵ Xuống dòng</button>
                        </div>
                        <div id="ad-b-scenario" class="rt-editor-box" contenteditable="true">${botData.scenario || ''}</div>
                    </div>
                    <div class="admin-form-group">
                        <label>Link Trò Chuyện (Đường dẫn gốc của Bot)</label>
                        <input type="text" id="ad-b-chat" value="${botData.chatLink || ''}" placeholder="https://...">
                    </div>
                    
                    <button class="admin-btn" id="ad-save-bot" style="width:100%; padding:15px; font-size:1rem; background: var(--accent); color:#fff; border:none; border-radius:8px;">LƯU HỒ SƠ</button>
                `;

                // Xử lý nạp ảnh
                document.getElementById("ad-b-file").addEventListener("change", async (e) => {
                    if (e.target.files.length > 0) {
                        document.getElementById("ad-b-prev").innerHTML = "Đang nén ảnh...";
                        tempAvatarB64 = await resizeImage(e.target.files[0], 1200);
                        document.getElementById("ad-b-prev").innerHTML = `<img src="${tempAvatarB64}" style="height:100px; border-radius:8px;">`;
                    }
                });

                // Ép xuống dòng an toàn cho Rich Text
                window.insertLineBreakAdmin = function() {
                    const ed = document.getElementById('ad-b-scenario');
                    if(ed) {
                        const div = document.createElement('div'); div.innerHTML = '<br>'; ed.appendChild(div);
                        const range = document.createRange(); const sel = window.getSelection();
                        range.setStart(div, 0); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); ed.focus();
                    }
                }

                // Xử lý Lưu
                document.getElementById("ad-save-bot").onclick = async () => {
                    if(!tempAvatarB64) return alert("Vui lòng tải ảnh nhân viên lên!");
                    
                    let tags = document.getElementById("ad-b-tags").value.split(',').map(t=>t.trim()).filter(t=>t);
                    let finalData = {
                        name: document.getElementById("ad-b-name").value.trim(),
                        staticRating: parseFloat(document.getElementById("ad-b-rating").value) || 5.0,
                        route: document.getElementById("ad-b-route").value,
                        avatar: tempAvatarB64,
                        tags: tags,
                        hook: document.getElementById("ad-b-hook").value.trim(),
                        scenario: document.getElementById("ad-b-scenario").innerHTML,
                        chatLink: document.getElementById("ad-b-chat").value.trim(),
                    };

                    if (action === 'add') {
                        finalData.id = "b_" + Date.now();
                        finalData.createdAt = Date.now();
                        finalData.isHidden = false;
                        CONFIG.staff.push(finalData);
                    } else {
                        let bot = CONFIG.staff.find(x => x.id === id);
                        Object.assign(bot, finalData);
                    }

                    document.getElementById("ad-save-bot").textContent = "Đang lưu lên đám mây...";
                    await saveConfig();
                    renderUI();
                    modal.classList.remove("show");
                };
            }
            modal.classList.add("show");
        }

        /* --- KHỞI CHẠY LÚC LOAD TRANG --- */
        document.addEventListener("DOMContentLoaded", () => {
            localforage.config({ name: 'MeownStationV2' });
            fetchConfig(); // Kéo data cũ về
        });

    </script>
</body>
</html>
